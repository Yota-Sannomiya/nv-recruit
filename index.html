<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const STORAGE_KEY = "nv-recruit-data";
const GAS_URL = "https://script.google.com/macros/s/AKfycbyBnmVegbUAJDRmmk8H4CXNi5L1vmZL8DjijFfRVlJ1Mmmkmh9xp9vWRU2YWOzij3SG/exec";

const STATUS_LIST = [
  "カジュアル：調整中", "カジュアル：日程確定", "カジュアル：完了", "カジュアル：辞退", "カジュアル：見送り",
  "書類選考中", "書類お見送り",

];

const KANBAN_COLUMNS = [
  { key: "カジュアル面談", statuses: ["カジュアル：調整中", "カジュアル：日程確定", "カジュアル：完了", "カジュアル：辞退", "カジュアル：見送り"], color: "#a78bfa" },
  { key: "書類選考", statuses: ["書類選考中", "書類お見送り"], color: "#3b82f6" },
  { key: "一次面接", statuses: ["一次：調整中", "一次：日程確定"], color: "#f59e0b" },
  { key: "一次結果", statuses: ["一次：合格", "一次：不合格"], color: "#8b5cf6" },

  { key: "最終面接", statuses: ["最終：調整中", "最終：日程確定"], color: "#06b6d4" },
  { key: "最終結果", statuses: ["最終：合格", "最終：不合格"], color: "#ec4899" },
  { key: "内定", statuses: ["内定：オファー面談", "内定：承諾", "内定：辞退"], color: "#22c55e" },
  { key: "辞退/入社", statuses: ["辞退", "入社済み"], color: "#6366f1" },

const POSITIONS = ["デジタルマーケティング", "HubSpotコンサル", "営業"];
const SOURCES = [
  "AMBI", "ビズリーチ", "doda", "circus", "Zキャリア", "Crowd Agent",
  "リクナビHRTech", "リクルート", "マイナビ", "エン・ジャパン", "マスメディアン",
  "パーソルキャリア", "キャリアデザインセンター", "Pitta", "Wantedly", "Green",
  "HP応募（自社）", "インフラトップ", "その他",
];
const INTERVIEWERS = ["今村さん", "田開さん", "髙山さん", "三宮さん", "市嶋さん", "その他"];
const REJECT_REASONS = ["スキル不足", "経験不足", "カルチャー不一致", "コミュニケーション", "希望条件不一致", "年齢", "学歴", "その他"];
const WITHDRAW_REASONS = ["他社決定", "現職残留", "条件不一致", "ギャップ", "選考スピード", "志望度低下", "家庭事情", "不明", "その他"];
const CASUAL_RESULTS = ["応募意思あり", "応募意思なし", "検討中", "見送り"];

const emptyCandidate = () => ({
  id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  name: "", status: "書類選考中", statusChangedDate: new Date().toISOString().slice(0, 10),
  position: "デジタルマーケティング",
  source: "", appliedDate: new Date().toISOString().slice(0, 10),
  age: "", currentCompany: "", currentPosition: "", currentSalary: "", desiredSalary: "",
  documentUrl: "", memo: "",
  // カジュアル面談
  casualDate: "", casualTime: "", casualInterviewer: "", casualResult: "", casualNote: "",
  // 書類選考
  docScreeningReason: "", docScreeningNote: "",
  // 一次面接
  interviewer1: "", interview1Date: "", interview1Time: "",
  interview1Result: "", interview1PassReason: "", interview1RejectReason: "", interview1Note: "",
  // 適性検査
  aptitudeSent: false, aptitudeResult: "", aptitudeNote: "",
  // 最終面接
  interviewerFinal: "", interviewFinalDate: "", interviewFinalTime: "",
  interviewFinalResult: "", interviewFinalPassReason: "", interviewFinalRejectReason: "", interviewFinalNote: "",
  // 内定
  offerDate: "", offerSalary: "",
  accepted: "", withdrawReason: "",
  startDate: "",
});

// ─── Utility ───
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
function fmtDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
}
function fmtDateTime(dateStr, timeStr) {
  if (!dateStr) return "";
  const base = fmtDate(dateStr);
  return timeStr ? `${base} ${timeStr}` : base;
}
function daysBetween(d1, d2) {
  if (!d1 || !d2) return null;
  const a = new Date(d1), b = new Date(d2);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}
function daysFromApply(c) {
  if (!c.appliedDate) return null;
  return daysBetween(c.appliedDate, new Date().toISOString().slice(0, 10));
}
function daysStalled(c) {
  const base = c.statusChangedDate || c.appliedDate;
  if (!base) return null;
  return daysBetween(base, new Date().toISOString().slice(0, 10));
}

// ─── Colors ───
const C = {
  bg: "#08090c", surface: "#111318", surfaceAlt: "#161921", card: "#1a1d27",
  cardHover: "#1f2330", border: "#252836",
  text: "#e4e5ec", textSub: "#9496a8", textDim: "#565870",
  accent: "#6366f1", accentL: "#818cf8", accentD: "#4f46e5",
  ok: "#22c55e", okBg: "#22c55e14", warn: "#f59e0b", warnBg: "#f59e0b14",
  bad: "#ef4444", badBg: "#ef444414", info: "#3b82f6", infoBg: "#3b82f614",
};

const statusColor = (s) => {
  const m = {
    "カジュアル：調整中": ["#a78bfa", "#a78bfa14"], "カジュアル：日程確定": ["#8b5cf6", "#8b5cf614"],
    "カジュアル：完了": ["#7c3aed", "#7c3aed14"], "カジュアル：辞退": ["#ef4444", "#ef444414"],
    "カジュアル：見送り": ["#ef4444", "#ef444414"],
    "書類選考中": ["#3b82f6", "#3b82f614"], "書類お見送り": ["#ef4444", "#ef444414"],
    "一次：調整中": ["#f59e0b", "#f59e0b14"], "一次：日程確定": ["#6366f1", "#6366f114"],
    "一次：合格": ["#22c55e", "#22c55e14"], "一次：不合格": ["#ef4444", "#ef444414"],
    "適性検査中": ["#06b6d4", "#06b6d414"],
    "最終：調整中": ["#f59e0b", "#f59e0b14"], "最終：日程確定": ["#8b5cf6", "#8b5cf614"],
    "最終：合格": ["#22c55e", "#22c55e14"], "最終：不合格": ["#ef4444", "#ef444414"],
    "内定：オファー面談": ["#8b5cf6", "#8b5cf614"], "内定：承諾": ["#22c55e", "#22c55e14"],
    "内定：辞退": ["#ef4444", "#ef444414"], "辞退": ["#ef4444", "#ef444414"],
    "入社済み": ["#10b981", "#10b98114"],
  };
  return m[s] || [C.textDim, C.border];
};

const inp = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 12px", color: C.text, fontSize: 13, outline: "none", width: "100%", boxSizing: "border-box" };
const btnS = { padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 6, transition: "all .15s" };

// ─── Shared Components ───
function Badge({ status }) {
  const [c, bg] = statusColor(status);
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 5, background: bg, color: c, padding: "2px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap" }}>
    <span style={{ width: 5, height: 5, borderRadius: "50%", background: c }} />{status}
  </span>;
}

function DaysChip({ days }) {
  if (days === null || days === undefined) return null;
  const color = days <= 14 ? C.ok : days <= 30 ? C.warn : C.bad;
  return <span style={{ fontSize: 10, fontWeight: 600, padding: "1px 6px", borderRadius: 8, background: color + "18", color }}>{days}日</span>;
}

function Modal({ open, onClose, title, children, width = 640 }) {
  if (!open) return null;
  return <div style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,.65)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
    <div style={{ background: C.surface, borderRadius: 16, border: `1px solid ${C.border}`, width: "100%", maxWidth: width, maxHeight: "90vh", overflow: "auto", boxShadow: "0 32px 64px rgba(0,0,0,.5)" }} onClick={e => e.stopPropagation()}>
      <div style={{ padding: "18px 24px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: C.surface, zIndex: 2, borderRadius: "16px 16px 0 0" }}>
        <h3 style={{ margin: 0, fontSize: 15, color: C.text, fontWeight: 700 }}>{title}</h3>
        <button onClick={onClose} style={{ ...btnS, background: "transparent", color: C.textDim, padding: "4px 8px", fontSize: 18 }}>✕</button>
      </div>
      <div style={{ padding: "18px 24px" }}>{children}</div>
    </div>
  </div>;
}

function Fl({ label, children }) { return <div style={{ marginBottom: 12 }}><label style={{ display: "block", fontSize: 10, color: C.textSub, marginBottom: 3, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5 }}>{label}</label>{children}</div>; }
function IFl({ label, value, onChange, type = "text", placeholder = "" }) { return <Fl label={label}><input type={type} value={value || ""} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={inp} /></Fl>; }
function SFl({ label, value, onChange, options, allowEmpty = true }) { return <Fl label={label}><select value={value || ""} onChange={e => onChange(e.target.value)} style={{ ...inp, appearance: "auto" }}>{allowEmpty && <option value="">--</option>}{options.map(o => <option key={o}>{o}</option>)}</select></Fl>; }
function CFl({ label, checked, onChange }) { return <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontSize: 12, color: C.text, marginBottom: 6 }}><input type="checkbox" checked={!!checked} onChange={e => onChange(e.target.checked)} style={{ accentColor: C.accent, width: 15, height: 15 }} />{label}</label>; }
function TFl({ label, value, onChange, rows = 2 }) { return <Fl label={label}><textarea value={value || ""} onChange={e => onChange(e.target.value)} rows={rows} style={{ ...inp, resize: "vertical" }} /></Fl>; }

function Section({ title, color = C.accentL, children }) {
  return <div style={{ borderTop: `1px solid ${C.border}`, margin: "16px 0", paddingTop: 16 }}>
    <h4 style={{ color, fontSize: 12, margin: "0 0 10px", fontWeight: 700 }}>{title}</h4>
    {children}
  </div>;
}

// ─── Custom Calendar Picker ───
function CalendarPicker({ value, onChange, label }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const today = new Date();
  const selDate = value ? new Date(value + "T00:00:00") : null;
  const [viewYear, setViewYear] = useState(selDate ? selDate.getFullYear() : today.getFullYear());
  const [viewMonth, setViewMonth] = useState(selDate ? selDate.getMonth() : today.getMonth());

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);

  useEffect(() => {
    if (open && value) {
      const d = new Date(value + "T00:00:00");
      if (!isNaN(d)) { setViewYear(d.getFullYear()); setViewMonth(d.getMonth()); }
    }
  }, [open]);

  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const prevM = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); } else setViewMonth(viewMonth - 1); };
  const nextM = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); } else setViewMonth(viewMonth + 1); };

  const pick = (day) => {
    const m = String(viewMonth + 1).padStart(2, "0");
    const d = String(day).padStart(2, "0");
    onChange(`${viewYear}-${m}-${d}`);
    setOpen(false);
  };

  const isToday = (day) => day === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
  const isSel = (day) => selDate && day === selDate.getDate() && viewMonth === selDate.getMonth() && viewYear === selDate.getFullYear();
  const isSun = (idx) => idx % 7 === 0;
  const isSat = (idx) => idx % 7 === 6;

  return <Fl label={label}>
    <div ref={ref} style={{ position: "relative" }}>
      <div onClick={() => setOpen(!open)} style={{ ...inp, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", minHeight: 37 }}>
        <span style={{ color: value ? C.text : C.textDim }}>{value ? fmtDate(value) : "日付を選択"}</span>
        <span style={{ fontSize: 14, color: C.textDim }}>📅</span>
      </div>
      {value && <button onClick={(e) => { e.stopPropagation(); onChange(""); }} style={{ position: "absolute", right: 32, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: C.textDim, cursor: "pointer", fontSize: 12, padding: 2 }}>✕</button>}

      {open && <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 1100, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 12, boxShadow: "0 16px 48px rgba(0,0,0,.5)", width: 280 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <button onClick={prevM} style={{ ...btnS, background: "transparent", color: C.textSub, padding: "4px 8px", fontSize: 14 }}>◀</button>
          <span style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{viewYear}年{viewMonth + 1}月</span>
          <button onClick={nextM} style={{ ...btnS, background: "transparent", color: C.textSub, padding: "4px 8px", fontSize: 14 }}>▶</button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1, marginBottom: 4 }}>
          {["日", "月", "火", "水", "木", "金", "土"].map((w, i) => <div key={w} style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: i === 0 ? "#ef4444" : i === 6 ? "#3b82f6" : C.textDim, padding: "4px 0" }}>{w}</div>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1 }}>
          {cells.map((day, idx) => day === null ?
            <div key={`e${idx}`} /> :
            <button key={idx} onClick={() => pick(day)} style={{
              ...btnS, padding: "6px 0", justifyContent: "center", fontSize: 12,
              background: isSel(day) ? C.accent : isToday(day) ? C.accent + "20" : "transparent",
              color: isSel(day) ? "#fff" : isSun(idx) ? "#ef4444" : isSat(idx) ? "#3b82f6" : C.text,
              borderRadius: 8, border: isToday(day) && !isSel(day) ? `1px solid ${C.accent}40` : "1px solid transparent",
              fontWeight: isToday(day) || isSel(day) ? 700 : 400,
              width: "100%",
            }}
            onMouseEnter={e => { if (!isSel(day)) e.currentTarget.style.background = C.cardHover; }}
            onMouseLeave={e => { if (!isSel(day)) e.currentTarget.style.background = isToday(day) ? C.accent + "20" : "transparent"; }}
            >{day}</button>
          )}
        </div>
        <div style={{ display: "flex", justifyContent: "center", marginTop: 8, gap: 6 }}>
          <button onClick={() => { const t = new Date(); setViewYear(t.getFullYear()); setViewMonth(t.getMonth()); pick(t.getDate()); }} style={{ ...btnS, background: C.accent + "14", color: C.accentL, fontSize: 10, padding: "4px 10px" }}>今日</button>
        </div>
      </div>}
    </div>
  </Fl>;
}

function KPICard({ label, value, sub, color = C.accent, icon }) {
  return <div style={{ background: C.card, borderRadius: 14, padding: "20px 18px", border: `1px solid ${C.border}`, position: "relative", overflow: "hidden" }}>
    <div style={{ position: "absolute", top: 12, right: 14, fontSize: 22, opacity: .15 }}>{icon}</div>
    <div style={{ fontSize: 32, fontWeight: 800, color, lineHeight: 1, letterSpacing: "-1px" }}>{value}</div>
    <div style={{ fontSize: 11, color: C.textSub, fontWeight: 600, marginTop: 6 }}>{label}</div>
    {sub && <div style={{ fontSize: 10, color: C.textDim, marginTop: 3 }}>{sub}</div>}
  </div>;
}

function FunnelBar({ label, value, maxVal, rate, color, sub }) {
  const pct = maxVal > 0 ? (value / maxVal) * 100 : 0;
  return <div style={{ marginBottom: 14 }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
      <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{label}</span>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
        <span style={{ fontSize: 20, fontWeight: 800, color }}>{value}</span>
        {rate !== undefined && <span style={{ fontSize: 11, color: C.textSub }}>通過率 {rate}%</span>}
      </div>
    </div>
    <div style={{ height: 10, background: C.surfaceAlt, borderRadius: 5, overflow: "hidden" }}>
      <div style={{ height: "100%", width: `${Math.max(pct, 2)}%`, background: `linear-gradient(90deg, ${color}, ${color}aa)`, borderRadius: 5, transition: "width .6s ease" }} />
    </div>
    {sub && <div style={{ fontSize: 10, color: C.textDim, marginTop: 3 }}>{sub}</div>}
  </div>;
}

// ─── Candidate Form ───
function CandidateForm({ candidate: c, onChange, onSave, onDelete, isNew }) {
  const u = (f, v) => onChange({ ...c, [f]: v });
  const elapsed = daysFromApply(c);

  return <div>
    {!isNew && elapsed !== null && <div style={{ display: "flex", gap: 10, marginBottom: 14, fontSize: 11, color: C.textSub }}>
      <span>応募から <DaysChip days={elapsed} /> 経過</span>
      {c.interview1Date && <span>応募→一次: {daysBetween(c.appliedDate, c.interview1Date)}日</span>}
      {c.interviewFinalDate && <span>応募→最終: {daysBetween(c.appliedDate, c.interviewFinalDate)}日</span>}
    </div>}

    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
      <IFl label="氏名" value={c.name} onChange={v => u("name", v)} />
      <SFl label="ステータス" value={c.status} onChange={v => { onChange({ ...c, status: v, statusChangedDate: v !== c.status ? new Date().toISOString().slice(0, 10) : c.statusChangedDate }); }} options={STATUS_LIST} allowEmpty={false} />
      <SFl label="職種" value={c.position} onChange={v => u("position", v)} options={POSITIONS} allowEmpty={false} />
      <SFl label="経由" value={c.source} onChange={v => u("source", v)} options={SOURCES} />
      <CalendarPicker label="応募日" value={c.appliedDate} onChange={v => u("appliedDate", v)} />
      <IFl label="年齢" value={c.age} onChange={v => u("age", v)} placeholder="28" />
      <IFl label="現職（社名）" value={c.currentCompany} onChange={v => u("currentCompany", v)} />
      <IFl label="現職（役職・職種）" value={c.currentPosition} onChange={v => u("currentPosition", v)} />
      <IFl label="現年収（万円）" value={c.currentSalary} onChange={v => u("currentSalary", v)} placeholder="500" />
      <IFl label="希望年収（万円）" value={c.desiredSalary} onChange={v => u("desiredSalary", v)} placeholder="600" />
    </div>
    <IFl label="書類URL（Google Drive等）" value={c.documentUrl} onChange={v => u("documentUrl", v)} placeholder="https://drive.google.com/..." />

    {/* カジュアル面談 */}
    <Section title="カジュアル面談" color="#a78bfa">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
        <SFl label="面談担当" value={c.casualInterviewer} onChange={v => u("casualInterviewer", v)} options={INTERVIEWERS} />
        <CalendarPicker label="面談日" value={c.casualDate} onChange={v => u("casualDate", v)} />
        <IFl label="時間" value={c.casualTime} onChange={v => u("casualTime", v)} type="time" />
        <SFl label="結果" value={c.casualResult} onChange={v => u("casualResult", v)} options={CASUAL_RESULTS} />
      </div>
      <TFl label="面談メモ・所感" value={c.casualNote} onChange={v => u("casualNote", v)} />
    </Section>

    {/* 書類選考 */}
    <Section title="書類選考">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
        <SFl label="お見送り理由" value={c.docScreeningReason} onChange={v => u("docScreeningReason", v)} options={REJECT_REASONS} />
        <IFl label="書類選考メモ" value={c.docScreeningNote} onChange={v => u("docScreeningNote", v)} />
      </div>
    </Section>

    if (fSt === "__active__" && CLOSED_STATUSES.includes(c.status)) return false;

// ─── Interview View ───
function InterviewView({ candidates, onSelect }) {
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = useMemo(() => {
    const r = [];
    candidates.forEach(c => {
      if (c.casualDate && c.casualDate >= today && !c.casualResult) r.push({ ...c, type: "カジュアル", date: c.casualDate, time: c.casualTime, who: c.casualInterviewer });
      if (c.interview1Date && c.interview1Date >= today && !c.interview1Result) r.push({ ...c, type: "一次", date: c.interview1Date, time: c.interview1Time, who: c.interviewer1 });
      if (c.interviewFinalDate && c.interviewFinalDate >= today && !c.interviewFinalResult) r.push({ ...c, type: "最終", date: c.interviewFinalDate, time: c.interviewFinalTime, who: c.interviewerFinal });
    });
    return r.sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  }, [candidates, today]);

  const past = useMemo(() => {
    const r = [];
    candidates.forEach(c => {
      if (c.casualDate && c.casualResult) r.push({ ...c, type: "カジュアル", date: c.casualDate, result: c.casualResult, note: c.casualNote, passReason: "", rejectReason: "" });
      if (c.interview1Date && c.interview1Result) r.push({ ...c, type: "一次", date: c.interview1Date, result: c.interview1Result, note: c.interview1Note, passReason: c.interview1PassReason, rejectReason: c.interview1RejectReason });
      if (c.interviewFinalDate && c.interviewFinalResult) r.push({ ...c, type: "最終", date: c.interviewFinalDate, result: c.interviewFinalResult, note: c.interviewFinalNote, passReason: c.interviewFinalPassReason, rejectReason: c.interviewFinalRejectReason });
    });
    return r.sort((a, b) => b.date.localeCompare(a.date));
  }, [candidates]);

  const resultColor = (r) => {
    if (r === "合格" || r === "応募意思あり") return { bg: C.okBg, color: C.ok };
    if (r === "不合格" || r === "応募意思なし" || r === "見送り") return { bg: C.badBg, color: C.bad };
    return { bg: C.warnBg, color: C.warn };
  };

  return <div>
    <h3 style={{ color: C.text, fontSize: 14, fontWeight: 700, marginBottom: 10 }}>今後の面接・面談（{upcoming.length}件）</h3>
    {upcoming.length === 0 && <p style={{ color: C.textDim, fontSize: 12 }}>予定なし</p>}
    <div style={{ display: "grid", gap: 6, marginBottom: 24 }}>{upcoming.map((it, i) => <div key={it.id + it.type + i} onClick={() => onSelect(it)} style={{ background: C.card, borderRadius: 12, padding: "12px 14px", border: `1px solid ${C.border}`, cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}
      onMouseEnter={e => e.currentTarget.style.borderColor = C.accent + "50"} onMouseLeave={e => e.currentTarget.style.borderColor = C.border}>
      <div style={{ minWidth: 48, textAlign: "center", background: C.accentD + "28", borderRadius: 10, padding: "7px 4px" }}><div style={{ fontSize: 17, fontWeight: 800, color: C.accentL }}>{it.date.slice(8)}</div><div style={{ fontSize: 9, color: C.textSub }}>{it.date.slice(5, 7)}月</div></div>
      <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 3 }}>{it.name}</div><div style={{ fontSize: 11, color: C.textSub }}>{it.type}面接　{fmtDateTime(it.date, it.time)}　{it.who || "担当未設定"}</div></div>
      <Badge status={it.status} />
    </div>)}</div>

    <h3 style={{ color: C.text, fontSize: 14, fontWeight: 700, marginBottom: 10 }}>面接・面談結果（直近{Math.min(past.length, 20)}件）</h3>
    <div style={{ display: "grid", gap: 6 }}>{past.slice(0, 20).map((it, i) => {
      const rc = resultColor(it.result);
      return <div key={it.id + it.type + i} onClick={() => onSelect(it)} style={{ background: C.card, borderRadius: 10, padding: "10px 14px", border: `1px solid ${C.border}`, cursor: "pointer" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}><span style={{ fontSize: 12, fontWeight: 600, color: C.text }}>{it.name}</span><span style={{ fontSize: 10, fontWeight: 600, padding: "2px 8px", borderRadius: 10, background: rc.bg, color: rc.color }}>{it.result}</span></div>
        <div style={{ fontSize: 11, color: C.textSub }}>{it.type}面接　{fmtDate(it.date)}</div>
        {it.passReason && <div style={{ fontSize: 11, color: C.ok, marginTop: 3 }}>通過理由: {it.passReason}</div>}
        {it.rejectReason && <div style={{ fontSize: 11, color: C.bad, marginTop: 3 }}>お見送り理由: {it.rejectReason}</div>}
        {it.note && <div style={{ fontSize: 11, color: C.textDim, marginTop: 3 }}>所感: {it.note}</div>}
      </div>;
    })}</div>
  </div>;
}

// ─── Analytics ───
function AnalyticsView({ candidates }) {
  const [dt, setDt] = useState("funnel");

  const s = useMemo(() => {
    const PASS_DOC = ["一次：調整中", "一次：日程確定", "一次：合格", "適性検査中", "最終：調整中", "最終：日程確定", "最終：合格", "内定：オファー面談", "内定：承諾", "入社済み"];
    const PASS_1 = ["一次：合格", "適性検査中", "最終：調整中", "最終：日程確定", "最終：合格", "内定：オファー面談", "内定：承諾", "入社済み"];
    const PASS_F = ["最終：合格", "内定：オファー面談", "内定：承諾", "入社済み"];
    const OFFER = ["内定：オファー面談", "内定：承諾", "入社済み"];
    const ACCEPTED = ["内定：承諾", "入社済み"];

    const total = candidates.length;
    const casual = candidates.filter(c => c.status?.startsWith("カジュアル")).length;
    const docP = candidates.filter(c => PASS_DOC.includes(c.status)).length;
    const i1D = candidates.filter(c => c.interview1Result).length;
    const i1P = candidates.filter(c => PASS_1.includes(c.status) || c.interview1Result === "合格").length;
    const iFD = candidates.filter(c => c.interviewFinalResult).length;
    const iFP = candidates.filter(c => PASS_F.includes(c.status) || c.interviewFinalResult === "合格").length;
    const offer = candidates.filter(c => OFFER.includes(c.status)).length;
    const accepted = candidates.filter(c => ACCEPTED.includes(c.status)).length;
    const entered = candidates.filter(c => c.status === "入社済み").length;
    const withdrew = candidates.filter(c => c.status === "辞退").length;
    const offerDec = candidates.filter(c => c.status === "内定：辞退").length;

    const speeds = { toInt1: [], toIntF: [], toOffer: [], total: [] };
    candidates.forEach(c => {
      if (c.appliedDate && c.interview1Date) { const d = daysBetween(c.appliedDate, c.interview1Date); if (d !== null && d >= 0) speeds.toInt1.push(d); }
      if (c.appliedDate && c.interviewFinalDate) { const d = daysBetween(c.appliedDate, c.interviewFinalDate); if (d !== null && d >= 0) speeds.toIntF.push(d); }
      if (c.appliedDate && c.offerDate) { const d = daysBetween(c.appliedDate, c.offerDate); if (d !== null && d >= 0) speeds.toOffer.push(d); }
      if (c.appliedDate && (c.status === "内定：承諾" || c.status === "入社済み") && c.offerDate) { const d = daysBetween(c.appliedDate, c.offerDate); if (d !== null && d >= 0) speeds.total.push(d); }
    });
    const avg = (arr) => arr.length > 0 ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;

    const bySrc = {}; const byPos = {};
    candidates.forEach(c => {
      const src = c.source || "不明";
      if (!bySrc[src]) bySrc[src] = { applied: 0, docPass: 0, pass1: 0, passF: 0, offer: 0, accepted: 0, declined: 0 };
      bySrc[src].applied++; if (PASS_DOC.includes(c.status)) bySrc[src].docPass++; if (PASS_1.includes(c.status)) bySrc[src].pass1++;
      if (PASS_F.includes(c.status)) bySrc[src].passF++; if (OFFER.includes(c.status)) bySrc[src].offer++;
      if (ACCEPTED.includes(c.status)) bySrc[src].accepted++; if (c.status === "辞退" || c.status === "内定：辞退") bySrc[src].declined++;

      const p = c.position || "不明";
      if (!byPos[p]) byPos[p] = { applied: 0, docPass: 0, offer: 0, accepted: 0, inProc: 0 };
      byPos[p].applied++; if (PASS_DOC.includes(c.status)) byPos[p].docPass++; if (OFFER.includes(c.status)) byPos[p].offer++;
      if (ACCEPTED.includes(c.status)) byPos[p].accepted++;
      if (!["辞退", "内定：辞退", "一次：不合格", "最終：不合格", "書類お見送り", "入社済み", "カジュアル：辞退", "カジュアル：見送り"].includes(c.status)) byPos[p].inProc++;
    });

    const rejectReasons = {};
    candidates.forEach(c => {
      [c.docScreeningReason, c.interview1RejectReason, c.interviewFinalRejectReason].forEach(r => { if (r) rejectReasons[r] = (rejectReasons[r] || 0) + 1; });
    });

function parseCSV(text) {
  const lines = []; let cur = []; let field = ""; let inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (ch === '"') inQ = false; else field += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ',') { cur.push(field.trim()); field = ""; } else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) { cur.push(field.trim()); if (cur.some(c => c)) lines.push(cur); cur = []; field = ""; if (ch === '\r') i++; } else field += ch; }
  }
  cur.push(field.trim()); if (cur.some(c => c)) lines.push(cur);
  return lines;
}

function mapStatus(raw) {
  if (!raw) return "書類選考中";
  const s = raw.trim();
  const exact = STATUS_LIST.find(st => st === s); if (exact) return exact;
  if (s.includes("カジュアル") && s.includes("辞退")) return "カジュアル：辞退";
  if (s.includes("カジュアル") && s.includes("見送")) return "カジュアル：見送り";
  if (s.includes("カジュアル") && s.includes("完了")) return "カジュアル：完了";
  if (s.includes("カジュアル") && s.includes("確定")) return "カジュアル：日程確定";
  if (s.includes("カジュアル")) return "カジュアル：調整中";
  if (s.includes("不合格") && s.includes("一次")) return "一次：不合格";
  if (s.includes("不合格") && s.includes("最終")) return "最終：不合格";
  if (s.includes("合格") && s.includes("一次")) return "一次：合格";
  if (s.includes("合格") && s.includes("最終")) return "最終：合格";
  if (s.includes("日程確定") && s.includes("一次")) return "一次：日程確定";
  if (s.includes("日程確定") && s.includes("最終")) return "最終：日程確定";
  if (s.includes("調整") && s.includes("一次")) return "一次：調整中";
  if (s.includes("調整") && s.includes("最終")) return "最終：調整中";
  if (s.includes("辞退") && s.includes("内定")) return "内定：辞退";
  if (s.includes("辞退")) return "辞退";
  if (s.includes("承諾")) return "内定：承諾";
  if (s.includes("内定")) return "内定：オファー面談";
  if (s.includes("適性")) return "適性検査中";
  if (s.includes("入社")) return "入社済み";
  if (s.includes("お見送り") && s.includes("書類")) return "書類お見送り";
  if (s.includes("不合格") && s.includes("書類")) return "書類お見送り";
  if (s.includes("書類")) return "書類選考中";
  return "書類選考中";
}

function parseDate(raw) { if (!raw) return ""; const s = raw.trim(); const iso = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if (iso) return `${iso[1]}-${iso[2].padStart(2, "0")}-${iso[3].padStart(2, "0")}`; const jp = s.match(/(\d{1,2})\/(\d{1,2})/); if (jp) { const y = new Date().getFullYear(); return `${y}-${jp[1].padStart(2, "0")}-${jp[2].padStart(2, "0")}`; } return ""; }
function parseTime(raw) { if (!raw) return ""; const m = raw.trim().match(/(\d{1,2}):(\d{2})/); return m ? `${m[1].padStart(2, "0")}:${m[2]}` : ""; }
function findCol(headers, ...kw) { return headers.findIndex(h => { const hl = (h || "").replace(/\s+/g, ""); return kw.some(k => hl.includes(k)); }); }

function csvToCandidate(row, hIdx) {

  return { ...emptyCandidate(), name: g(hIdx.name), status: mapStatus(g(hIdx.status)), position: g(hIdx.position) || "デジタルマーケティング", source: g(hIdx.source), appliedDate: parseDate(g(hIdx.appliedDate)) || new Date().toISOString().slice(0, 10), interviewer1: g(hIdx.interviewer1), interview1Date: parseDate(g(hIdx.int1Date)), interview1Time: parseTime(g(hIdx.int1Time)), interview1Result: g(hIdx.int1Result), interview1Note: g(hIdx.int1Note), interviewFinalDate: parseDate(g(hIdx.intFDate)), interviewFinalTime: parseTime(g(hIdx.intFTime)), interviewFinalResult: g(hIdx.intFResult), interviewFinalNote: g(hIdx.intFNote), memo: g(hIdx.memo) };
}

function detectColumns(headers) {
  const fc = (kw) => findCol(headers, ...kw);
  const findNth = (kw, n) => { const all = headers.map((h, i) => ({ h: (h || "").replace(/\s+/g, ""), i })).filter(x => kw.some(k => x.h.includes(k))); return all.length > n ? all[n].i : -1; };
  return { name: fc("氏名", "名前"), status: fc("ステータス"), position: fc("職種", "ポジション"), source: fc("経由", "チャネル", "媒体"), appliedDate: fc("応募日", "応募"), interviewer1: fc("面接官"), int1Date: findNth(["日程"], 0), int1Time: findNth(["時間"], 0), int1Result: findNth(["合否"], 0), int1Note: findNth(["所感"], 0), intFDate: findNth(["日程"], 1), intFTime: findNth(["時間"], 1), intFResult: findNth(["合否"], 1), intFNote: findNth(["所感"], 1), memo: fc("備考", "メモ") };
}

function exportCSV(candidates) {
  const h = ["氏名","ステータス","ステータス更新日","職種","経由","応募日","年齢","現職社名","現職役職","現年収","希望年収","書類URL","カジュアル面談日","カジュアル時間","カジュアル担当","カジュアル結果","カジュアルメモ","書類お見送り理由","面接官(一次)","一次日程","一次時間","一次合否","一次通過理由","一次お見送り理由","一次所感","適性検査送付","適性検査結果","適性検査メモ","面接官(最終)","最終日程","最終時間","最終合否","最終通過理由","最終お見送り理由","最終所感","オファー日","提示年収","承諾","辞退理由","入社予定日","備考"];
  const esc = (v) => { const s = String(v ?? ""); return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = candidates.map(c => [c.name, c.status, c.statusChangedDate, c.position, c.source, c.appliedDate, c.age, c.currentCompany, c.currentPosition, c.currentSalary, c.desiredSalary, c.documentUrl, c.casualDate, c.casualTime, c.casualInterviewer, c.casualResult, c.casualNote, c.docScreeningReason, c.interviewer1, c.interview1Date, c.interview1Time, c.interview1Result, c.interview1PassReason, c.interview1RejectReason, c.interview1Note, c.aptitudeSent, c.aptitudeResult, c.aptitudeNote, c.interviewerFinal, c.interviewFinalDate, c.interviewFinalTime, c.interviewFinalResult, c.interviewFinalPassReason, c.interviewFinalRejectReason, c.interviewFinalNote, c.offerDate, c.offerSalary, c.accepted, c.withdrawReason, c.startDate, c.memo].map(esc).join(","));
  return "\uFEFF" + h.join(",") + "\n" + rows.join("\n");
}

// ─── Import Modal ───
function ImportModal({ open, onClose, onImport }) {
  const [step, setStep] = useState(1); const [preview, setPreview] = useState([]); const [importMode, setImportMode] = useState("append"); const fileRef = useRef(null);
  const reset = () => { setStep(1); setPreview([]); };
  const handleFile = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const lines = parseCSV(ev.target.result); if (lines.length < 2) return;
      let hRow = 0;
      for (let i = 0; i < Math.min(lines.length, 10); i++) { if (lines[i].some(c => (c || "").includes("氏名") || (c || "").includes("ステータス"))) { hRow = i; break; } }
      const idx = detectColumns(lines[hRow]);
      const mapped = lines.slice(hRow + 1).filter(r => r.some(c => c)).map(r => csvToCandidate(r, idx)).filter(c => c.name);
      setPreview(mapped); setStep(2);
    };
    reader.readAsText(file, "UTF-8");
  };

  if (!open) return null;
  return <Modal open={open} onClose={() => { reset(); onClose(); }} title="CSVインポート" width={720}>
    {step === 1 && <div>
      <p style={{ color: C.textSub, fontSize: 13, marginBottom: 16 }}>CSVファイルを選択してください。ヘッダー行を自動検出して取り込みます。</p>
      <div style={{ border: `2px dashed ${C.border}`, borderRadius: 12, padding: "40px 20px", textAlign: "center", cursor: "pointer" }} onClick={() => fileRef.current?.click()}
        onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor = C.accent; }} onDragLeave={e => { e.currentTarget.style.borderColor = C.border; }}
        onDrop={e => { e.preventDefault(); e.currentTarget.style.borderColor = C.border; const f = e.dataTransfer.files?.[0]; if (f) handleFile({ target: { files: [f] } }); }}>
        <div style={{ fontSize: 32, marginBottom: 8 }}>📄</div>
        <div style={{ color: C.text, fontWeight: 600, fontSize: 14 }}>CSVファイルを選択 or ドロップ</div>
        <input ref={fileRef} type="file" accept=".csv,.tsv,.txt" style={{ display: "none" }} onChange={handleFile} />
      </div>
    </div>}
    {step === 2 && <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{preview.length}名のデータを検出</div>
        <select value={importMode} onChange={e => setImportMode(e.target.value)} style={{ ...inp, width: 150, appearance: "auto", fontSize: 12 }}>
          <option value="append">追加（既存に追加）</option><option value="replace">置換（全入替え）</option>
        </select>
      </div>
      <div style={{ overflowX: "auto", maxHeight: 300, marginBottom: 16, border: `1px solid ${C.border}`, borderRadius: 10 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
          <thead><tr style={{ background: C.surfaceAlt, position: "sticky", top: 0 }}>{["氏名", "ステータス", "職種", "経由", "応募日"].map(h => <th key={h} style={{ padding: "6px 10px", textAlign: "left", color: C.textDim, fontSize: 10, fontWeight: 700 }}>{h}</th>)}</tr></thead>
          <tbody>{preview.slice(0, 50).map((c, i) => <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
            <td style={{ padding: "5px 10px", color: C.text, fontWeight: 600 }}>{c.name}</td><td style={{ padding: "5px 10px" }}><Badge status={c.status} /></td>
            <td style={{ padding: "5px 10px", color: C.textSub }}>{c.position}</td><td style={{ padding: "5px 10px", color: C.textSub }}>{c.source}</td>
            <td style={{ padding: "5px 10px", color: C.textSub }}>{c.appliedDate}</td>
          </tr>)}</tbody>
        </table>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between" }}>
        <button onClick={reset} style={{ ...btnS, background: C.surfaceAlt, color: C.textSub }}>戻る</button>
        <button onClick={() => { onImport(preview, importMode); setStep(3); }} style={{ ...btnS, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff", padding: "10px 24px" }}>{importMode === "replace" ? `${preview.length}名で置換` : `${preview.length}名を追加`}</button>
      </div>
    </div>}
    {step === 3 && <div style={{ textAlign: "center", padding: "30px 0" }}>
      <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
      <div style={{ fontSize: 16, fontWeight: 700, color: C.text, marginBottom: 6 }}>{preview.length}名を取り込みました</div>
      <button onClick={() => { reset(); onClose(); }} style={{ ...btnS, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff", padding: "10px 24px", marginTop: 12 }}>閉じる</button>
    </div>}
  </Modal>;
}

// ─── GAS API ───
async function gasGet(pw, action = "list", params = {}) {
  const url = new URL(GAS_URL); url.searchParams.set("pw", pw); url.searchParams.set("action", action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { redirect: "follow" }); return res.json();
}
async function gasPost(pw, body) {
  const res = await fetch(GAS_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pw, ...body }) });
  return res.json();
}

// ─── Main App ───
function App() {
  const [authed, setAuthed] = useState(false);
  const [candidates, setCandidates] = useState([]);
  const [tab, setTab] = useState("list");
  const [modal, setModal] = useState(null);
  const [editC, setEditC] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const [pw, setPw] = useState("");
  const [pwErr, setPwErr] = useState("");
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (!authed) return; setLoading(true);
    (async () => { try { const r = await gasGet(pw, "list"); if (r.ok) setCandidates(r.data || []); } catch (e) { console.warn(e); } setLoading(false); })();
  }, [authed]);

  const saveSingle = useCallback(async (c) => { setSaving(true); try { await gasPost(pw, { action: "save", data: c }); } catch {} setSaving(false); }, [pw]);
  const deleteSingle = useCallback(async (id) => { try { await gasPost(pw, { action: "delete", id }); } catch {} }, [pw]);
  const bulkSave = useCallback(async (data, mode) => { setSaving(true); try { await gasPost(pw, { action: "bulk_save", data, mode }); } catch {} setSaving(false); }, [pw]);

  const handleLogin = async () => {
    if (!pw) { setPwErr("パスワードを入力してください"); return; }
    setPwErr("");
    try { const r = await gasGet(pw, "auth"); if (r.ok) setAuthed(true); else setPwErr(r.message || "パスワードが違います"); }
    catch (e) { setPwErr("接続エラー: " + e.message); }
  };

  if (!authed) return <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans JP', 'SF Pro Display', sans-serif" }}>
    <div style={{ background: C.surface, borderRadius: 20, border: `1px solid ${C.border}`, padding: "44px 36px", width: 380, boxShadow: "0 32px 64px rgba(0,0,0,.35)", textAlign: "center" }}>
      <div style={{ width: 50, height: 50, borderRadius: 12, background: `linear-gradient(135deg, ${C.accent}, ${C.accentL})`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px", fontSize: 22 }}>⚡</div>
      <h1 style={{ color: C.text, fontSize: 18, fontWeight: 800, margin: "0 0 4px" }}>採用管理ツール</h1>
      <p style={{ color: C.textSub, fontSize: 11, margin: "0 0 24px" }}>NowVillage Recruitment Manager</p>
      <input type="password" placeholder="パスワード" value={pw} onChange={e => { setPw(e.target.value); setPwErr(""); }}
        onKeyDown={e => e.key === "Enter" && handleLogin()} autoFocus style={{ ...inp, marginBottom: 14, textAlign: "center", fontSize: 14 }} />
      <button onClick={handleLogin} style={{ ...btnS, width: "100%", justifyContent: "center", background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff", padding: 11, fontSize: 13 }}>ログイン</button>
      {pwErr && <p style={{ color: C.bad, fontSize: 11, marginTop: 10 }}>{pwErr}</p>}
    </div>
  </div>;

  if (loading) return <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", color: C.textSub, fontFamily: "'Noto Sans JP', sans-serif" }}>読み込み中…</div>;

  const openNew = () => { setEditC(emptyCandidate()); setModal({ mode: "new" }); };
  const openEdit = (c) => { setEditC({ ...c }); setModal({ mode: "edit" }); };
  const handleSave = async () => { if (!editC) return; if (modal.mode === "new") setCandidates(p => [editC, ...p]); else setCandidates(p => p.map(c => c.id === editC.id ? editC : c)); setModal(null); setEditC(null); await saveSingle(editC); };
  const handleDel = async () => { if (!editC || !confirm("削除しますか？")) return; const id = editC.id; setCandidates(p => p.filter(c => c.id !== id)); setModal(null); setEditC(null); await deleteSingle(id); };
  const handleSC = async (id, st) => { const today = new Date().toISOString().slice(0, 10); const upd = candidates.map(c => c.id === id ? { ...c, status: st, statusChangedDate: today } : c); setCandidates(upd); const t = upd.find(c => c.id === id); if (t) await saveSingle(t); };
  const handleImport = async (data, mode) => { if (mode === "replace") setCandidates(data); else setCandidates(p => [...data, ...p]); await bulkSave(data, mode); };
  const handleBulkStatus = async (ids, status) => { const today = new Date().toISOString().slice(0, 10); const upd = candidates.map(c => ids.includes(c.id) ? { ...c, status, statusChangedDate: today } : c); setCandidates(upd); await bulkSave(upd.filter(c => ids.includes(c.id)), "append"); };
  const handleBulkDelete = async (ids) => { setCandidates(p => p.filter(c => !ids.includes(c.id))); for (const id of ids) await deleteSingle(id); };
  const handleExport = () => { const csv = exportCSV(candidates); const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = `nv_recruit_${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };

  const tabs = [{ key: "list", label: "一覧", icon: "☰" }, { key: "kanban", label: "カンバン", icon: "▦" }, { key: "interview", label: "面接", icon: "📋" }, { key: "analytics", label: "ダッシュボード", icon: "📊" }];

  return <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif" }}>
    <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "0 20px", position: "sticky", top: 0, zIndex: 100 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", maxWidth: 1400, margin: "0 auto", height: 52 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ width: 28, height: 28, borderRadius: 7, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>⚡</div><span style={{ fontWeight: 800, fontSize: 14, color: C.text }}>NV採用管理</span>{saving && <span style={{ fontSize: 9, color: C.warn, fontWeight: 600 }}>保存中…</span>}</div>
        <div style={{ display: "flex", gap: 2 }}>{tabs.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={{ ...btnS, background: tab === t.key ? C.accent + "18" : "transparent", color: tab === t.key ? C.accentL : C.textSub, padding: "7px 12px", fontSize: 11, borderBottom: tab === t.key ? `2px solid ${C.accent}` : "2px solid transparent" }}>{t.icon} {t.label}</button>)}</div>
        <button onClick={() => setAuthed(false)} style={{ ...btnS, background: "transparent", color: C.textDim, fontSize: 10 }}>ログアウト</button>
      </div>
    </div>
    <div style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 20px 60px" }}>
      {tab === "list" && <ListView candidates={candidates} onSelect={openEdit} onAdd={openNew} onImport={() => setImportOpen(true)} onExport={handleExport} onBulkStatus={handleBulkStatus} onBulkDelete={handleBulkDelete} />}
      {tab === "kanban" && <KanbanView candidates={candidates} onSelect={openEdit} onStatusChange={handleSC} />}
      {tab === "interview" && <InterviewView candidates={candidates} onSelect={openEdit} />}
      {tab === "analytics" && <AnalyticsView candidates={candidates} />}
    </div>
    <Modal open={!!modal} onClose={() => { setModal(null); setEditC(null); }} title={modal?.mode === "new" ? "候補者を追加" : `${editC?.name || ""} を編集`}>
      {editC && <CandidateForm candidate={editC} onChange={setEditC} onSave={handleSave} onDelete={handleDel} isNew={modal?.mode === "new"} />}
    </Modal>
    <ImportModal open={importOpen} onClose={() => setImportOpen(false)} onImport={handleImport} />
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
