// ─── Utility ───
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
const DATE_FIELDS = ["appliedDate", "statusChangedDate", "casualDate", "interview1Date", "interview2Date", "interviewFinalDate", "offerDate", "startDate"];
const TIME_FIELDS = ["casualTime", "interview1Time", "interview2Time", "interviewFinalTime", "offerTime"];
function normalizeDate(v) {
  if (!v) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if (isNaN(d)) return v;
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  if (jst.getUTCFullYear() <= 1900) return "";
  return `${jst.getUTCFullYear()}-${String(jst.getUTCMonth() + 1).padStart(2, "0")}-${String(jst.getUTCDate()).padStart(2, "0")}`;
}
function normalizeTime(v) {
  if (!v) return "";
  if (/^\d{1,2}:\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if (!isNaN(d)) { const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000); return `${String(jst.getUTCHours()).padStart(2, "0")}:${String(jst.getUTCMinutes()).padStart(2, "0")}`; }
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  if (m) return `${m[1].padStart(2, "0")}:${m[2]}`;
  return "";
}
function normalizeCandidateDates(c) {
  const out = { ...c };
  for (const k of DATE_FIELDS) { if (out[k]) out[k] = normalizeDate(out[k]); }
  for (const k of TIME_FIELDS) { if (out[k]) out[k] = normalizeTime(out[k]); }
  return out;
}
function fmtDate(dateStr) {
  if (!dateStr) return "";
  const s = normalizeDate(dateStr);
  const d = new Date(s + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
}
function fmtDateTime(dateStr, timeStr) {
  if (!dateStr) return "";
  const base = fmtDate(dateStr);
  return timeStr ? `${base} ${timeStr}` : base;
}
function daysBetween(d1, d2) {
  if (!d1 || !d2) return null;
  const a = new Date(d1), b = new Date(d2);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}
function daysFromApply(c) {
  if (!c.appliedDate) return null;
  return daysBetween(c.appliedDate, new Date().toISOString().slice(0, 10));
}
function daysStalled(c) {
  const base = c.statusChangedDate || c.appliedDate;
  if (!base) return null;
  return daysBetween(base, new Date().toISOString().slice(0, 10));
}

function Fl({ label, children }) { return <div style={{ marginBottom: 12 }}><label style={{ display: "block", fontSize: 10, color: C.textSub, marginBottom: 3, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5 }}>{label}</label>{children}</div>; }
function IFl({ label, value, onChange, type = "text", placeholder = "" }) { return <Fl label={label}><input type={type} value={value || ""} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={inp} /></Fl>; }
function SFl({ label, value, onChange, options, allowEmpty = true }) { return <Fl label={label}><select value={value || ""} onChange={e => onChange(e.target.value)} style={{ ...inp, appearance: "auto" }}>{allowEmpty && <option value="">--</option>}{options.map(o => <option key={o}>{o}</option>)}</select></Fl>; }
function CFl({ label, checked, onChange }) { return <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontSize: 12, color: C.text, marginBottom: 6 }}><input type="checkbox" checked={!!checked} onChange={e => onChange(e.target.checked)} style={{ accentColor: C.accent, width: 15, height: 15 }} />{label}</label>; }
function TFl({ label, value, onChange, rows = 2 }) { return <Fl label={label}><textarea value={value || ""} onChange={e => onChange(e.target.value)} rows={rows} style={{ ...inp, resize: "vertical" }} /></Fl>; }

// ─── Custom Calendar Picker ───
const CalendarPicker = React.memo(function CalendarPicker({ value: rawValue, onChange, label }) {
  const value = useMemo(() => normalizeDate(rawValue), [rawValue]);
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const today = useMemo(() => new Date(), []);
  const selDate = useMemo(() => value ? new Date(value + "T00:00:00") : null, [value]);
  const [viewYear, setViewYear] = useState(selDate ? selDate.getFullYear() : today.getFullYear());
  const [viewMonth, setViewMonth] = useState(selDate ? selDate.getMonth() : today.getMonth());

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);

  useEffect(() => {
    if (open && value) {
      const d = new Date(value + "T00:00:00");
      if (!isNaN(d)) { setViewYear(d.getFullYear()); setViewMonth(d.getMonth()); }
    }
  }, [open]);

  const cells = useMemo(() => {
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const c = [];
    for (let i = 0; i < firstDay; i++) c.push(null);
    for (let d = 1; d <= daysInMonth; d++) c.push(d);
    return c;
  }, [viewYear, viewMonth]);

  const prevM = useCallback(() => { if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); } else setViewMonth(m => m - 1); }, [viewMonth]);
  const nextM = useCallback(() => { if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); } else setViewMonth(m => m + 1); }, [viewMonth]);

  const pick = useCallback((day) => {
    const m = String(viewMonth + 1).padStart(2, "0");
    const d = String(day).padStart(2, "0");
    onChange(`${viewYear}-${m}-${d}`);
    setOpen(false);
  }, [viewYear, viewMonth, onChange]);

  const todayD = today.getDate(), todayM = today.getMonth(), todayY = today.getFullYear();
  const selD = selDate?.getDate(), selM = selDate?.getMonth(), selY = selDate?.getFullYear();

  return <Fl label={label}>
    <div ref={ref} style={{ position: "relative" }}>
      <div onClick={() => setOpen(!open)} style={{ ...inp, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", minHeight: 37 }}>
        <span style={{ color: value ? C.text : C.textDim }}>{value ? fmtDate(value) : "日付を選択"}</span>
        <span style={{ fontSize: 14, color: C.textDim }}>📅</span>
      </div>
      {value && <button onClick={(e) => { e.stopPropagation(); onChange(""); }} style={{ position: "absolute", right: 32, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: C.textDim, cursor: "pointer", fontSize: 12, padding: 2 }}>✕</button>}

      {open && <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 1100, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 12, boxShadow: "0 16px 48px rgba(0,0,0,.5)", width: 280 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <button onClick={prevM} style={{ ...btnS, background: "transparent", color: C.textSub, padding: "4px 8px", fontSize: 14 }}>◀</button>
          <span style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{viewYear}年{viewMonth + 1}月</span>
          <button onClick={nextM} style={{ ...btnS, background: "transparent", color: C.textSub, padding: "4px 8px", fontSize: 14 }}>▶</button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1, marginBottom: 4 }}>
          {["日", "月", "火", "水", "木", "金", "土"].map((w, i) => <div key={w} style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: i === 0 ? "#ef4444" : i === 6 ? "#3b82f6" : C.textDim, padding: "4px 0" }}>{w}</div>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1 }}>
          {cells.map((day, idx) => day === null ?
            <div key={`e${idx}`} /> :
            <button key={idx} onClick={() => pick(day)} style={{
              ...btnS, padding: "6px 0", justifyContent: "center", fontSize: 12,
              background: (day === selD && viewMonth === selM && viewYear === selY) ? C.accent : (day === todayD && viewMonth === todayM && viewYear === todayY) ? C.accent + "20" : "transparent",
              color: (day === selD && viewMonth === selM && viewYear === selY) ? "#fff" : idx % 7 === 0 ? "#ef4444" : idx % 7 === 6 ? "#3b82f6" : C.text,
              borderRadius: 8, border: (day === todayD && viewMonth === todayM && viewYear === todayY) && !(day === selD && viewMonth === selM && viewYear === selY) ? `1px solid ${C.accent}40` : "1px solid transparent",
              fontWeight: (day === todayD && viewMonth === todayM && viewYear === todayY) || (day === selD && viewMonth === selM && viewYear === selY) ? 700 : 400,
              width: "100%",
            }}>{day}</button>
          )}
        </div>
        <div style={{ display: "flex", justifyContent: "center", marginTop: 8, gap: 6 }}>
          <button onClick={() => { const t = new Date(); setViewYear(t.getFullYear()); setViewMonth(t.getMonth()); pick(t.getDate()); }} style={{ ...btnS, background: C.accent + "14", color: C.accentL, fontSize: 10, padding: "4px 10px" }}>今日</button>
        </div>
      </div>}
    </div>
  </Fl>;
});

function TrapezoidFunnel({ stages, onDrillDown }) {
  if (!stages || stages.length === 0) return <div style={{ textAlign: "center", padding: 30, color: C.textDim }}>データなし</div>;
  const maxVal = Math.max(...stages.map(st => st.value), 1);
  const rowH = 52, gap = 6, svgW = 640;
  const totalH = stages.length * rowH + (stages.length - 1) * gap;
  const minPct = 0.18, maxPct = 0.95;
  const [hover, setHover] = React.useState(null);

  return <div>
    <svg viewBox={`0 0 ${svgW} ${totalH}`} style={{ width: "100%" }}>
      <defs>
        {stages.map((st, i) => <linearGradient key={i} id={`fg${i}`} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor={st.color} stopOpacity="0.9" />
          <stop offset="100%" stopColor={st.color} stopOpacity="0.5" />
        </linearGradient>)}
      </defs>
      {stages.map((st, i) => {
        const pct = maxVal > 0 ? minPct + (st.value / maxVal) * (maxPct - minPct) : minPct;
        const nextPct = i < stages.length - 1
          ? (maxVal > 0 ? minPct + (stages[i + 1].value / maxVal) * (maxPct - minPct) : minPct)
          : pct;
        const y = i * (rowH + gap);
        const cx = svgW / 2;
        const topW = pct * svgW * 0.85;
        const botW = nextPct * svgW * 0.85;
        const pts = `${cx - topW / 2},${y} ${cx + topW / 2},${y} ${cx + botW / 2},${y + rowH} ${cx - botW / 2},${y + rowH}`;
        const isHover = hover === i;
        return <g key={i}>
          <polygon
            points={pts}
            fill={`url(#fg${i})`}
            stroke={st.color}
            strokeWidth={isHover ? 2 : 0.5}
            strokeOpacity={isHover ? 0.8 : 0.3}
            style={{ cursor: "pointer", transition: "all .2s", filter: isHover ? `drop-shadow(0 0 8px ${st.color}60)` : "none" }}
            onClick={() => onDrillDown && st.onClick && st.onClick()}
            onMouseEnter={() => setHover(i)}
            onMouseLeave={() => setHover(null)}
          />
          <text x={cx} y={y + rowH / 2 - 6} textAnchor="middle" fill="#fff" fontSize="18" fontWeight="800" style={{ pointerEvents: "none" }}>
            {st.value}
          </text>
          <text x={cx} y={y + rowH / 2 + 12} textAnchor="middle" fill="rgba(255,255,255,.7)" fontSize="11" fontWeight="600" style={{ pointerEvents: "none" }}>
            {st.label}
          </text>
          {st.rate !== undefined && <g style={{ pointerEvents: "none" }}>
            <text x={cx + topW / 2 + 10} y={y + rowH / 2 - 4} textAnchor="start" fill={C.textSub} fontSize="10" fontWeight="600">
              前段階比 {st.rate}%
            </text>
            {st.cumRate !== undefined && <text x={cx + topW / 2 + 10} y={y + rowH / 2 + 10} textAnchor="start" fill={C.warn} fontSize="10" fontWeight="700">
              応募比 {st.cumRate}%
            </text>}
          </g>}
        </g>;
      })}
    </svg>
  </div>;
}

function CircularGauge({ value, target, label, size = 110 }) {
  const r = size * 0.38;
  const circ = 2 * Math.PI * r;
  const progress = value !== null ? Math.min(value / target, 1) : 0;
  const color = value === null ? C.textDim : value <= target ? C.ok : value <= target * 1.5 ? C.warn : C.bad;
  const cx = size / 2, cy = size / 2;
  return <div style={{ textAlign: "center" }}>
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.border} strokeWidth={8} />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={8}
        strokeDasharray={circ} strokeDashoffset={circ - circ * progress}
        strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`}
        style={{ transition: "stroke-dashoffset .8s ease, stroke .4s" }}
      />
      <text x={cx} y={cy - 2} textAnchor="middle" dominantBaseline="central" fill={color} fontSize="20" fontWeight="800">
        {value !== null ? value : "–"}
      </text>
      <text x={cx} y={cy + 16} textAnchor="middle" dominantBaseline="central" fill={C.textDim} fontSize="10">
        {value !== null ? "日" : ""}
      </text>
    </svg>
    <div style={{ fontSize: 11, color: C.textSub, fontWeight: 600, marginTop: 2 }}>{label}</div>
    <div style={{ fontSize: 10, color: C.textDim, marginTop: 2 }}>目安: {target}日</div>
  </div>;
}

function SVGLineChart({ data, series, height = 280 }) {
  const [hover, setHover] = React.useState(null);
  if (!data || data.length === 0) return <div style={{ textAlign: "center", padding: 30, color: C.textDim }}>データなし</div>;
  const width = 720;
  const padL = 50, padR = 24, padT = 16, padB = 44;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const allVals = data.flatMap(d => series.map(s => d.values[s.key] || 0));
  const maxY = Math.max(...allVals, 1);
  const niceMax = Math.ceil(maxY / (maxY > 20 ? 5 : maxY > 5 ? 2 : 1)) * (maxY > 20 ? 5 : maxY > 5 ? 2 : 1);
  const xStep = data.length > 1 ? plotW / (data.length - 1) : plotW;
  const toX = (i) => padL + (data.length > 1 ? i * xStep : plotW / 2);
  const toY = (v) => padT + plotH - (v / niceMax) * plotH;
  const yTicks = Math.min(5, niceMax);
  const barSeries = series.filter(s => s.type === "bar");
  const barGroupW = data.length > 1 ? Math.min(xStep * 0.7, 48) : 48;
  const barW = barSeries.length > 0 ? barGroupW / barSeries.length : barGroupW;

  return <div>
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", display: "block" }}>
      {/* グリッド */}
      {Array.from({ length: yTicks + 1 }, (_, i) => {
        const v = Math.round(niceMax * i / yTicks);
        const y = toY(v);
        return <g key={i}>
          <line x1={padL} y1={y} x2={width - padR} y2={y} stroke={C.border} strokeDasharray={i === 0 ? "0" : "4,4"} strokeWidth={0.8} />
          <text x={padL - 8} y={y + 3} textAnchor="end" fill={C.textDim} fontSize="10">{v}</text>
        </g>;
      })}
      {/* X軸ラベル */}
      {data.map((d, i) => <text key={i} x={toX(i)} y={height - 8} textAnchor="middle" fill={C.textSub} fontSize="10" fontWeight="500">{d.label}</text>)}
      {/* 棒グラフ */}
      {barSeries.map((s, si) => data.map((d, i) => {
        const v = d.values[s.key] || 0;
        const bx = toX(i) - barGroupW / 2 + si * barW;
        const bh = (v / niceMax) * plotH;
        return <rect key={`${s.key}-${i}`} x={bx} y={toY(v)} width={barW - 2} height={Math.max(bh, 0)} rx={3}
          fill={s.color} opacity={hover === i ? 0.95 : 0.65} style={{ transition: "opacity .15s" }} />;
      }))}
      {/* エリア */}
      {series.filter(s => s.type === "area").map(s => {
        const pts = [`${toX(0)},${toY(0)}`, ...data.map((d, i) => `${toX(i)},${toY(d.values[s.key] || 0)}`), `${toX(data.length - 1)},${toY(0)}`].join(" ");
        return <polygon key={s.key} points={pts} fill={s.color} fillOpacity={0.12} />;
      })}
      {/* 折れ線 */}
      {series.filter(s => s.type === "line" || s.type === "area").map(s => {
        const pts = data.map((d, i) => `${toX(i)},${toY(d.values[s.key] || 0)}`).join(" ");
        return <g key={s.key}>
          <polyline points={pts} fill="none" stroke={s.color} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round" />
          {data.map((d, i) => <circle key={i} cx={toX(i)} cy={toY(d.values[s.key] || 0)} r={hover === i ? 5 : 3} fill={s.color} stroke={C.card} strokeWidth={2} style={{ transition: "r .15s" }} />)}
        </g>;
      })}
      {/* ホバー領域 */}
      {data.map((d, i) => <rect key={i} x={data.length > 1 ? toX(i) - xStep / 2 : padL} y={padT} width={data.length > 1 ? xStep : plotW} height={plotH}
        fill="transparent" onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} />)}
      {/* ホバーツールチップ */}
      {hover !== null && <g style={{ pointerEvents: "none" }}>
        <line x1={toX(hover)} y1={padT} x2={toX(hover)} y2={padT + plotH} stroke={C.textDim} strokeDasharray="3,3" strokeWidth={1} />
        <rect x={Math.min(toX(hover) + 10, width - padR - 130)} y={padT + 4} width={120} height={16 + series.length * 18} rx={8} fill={C.surface} stroke={C.border} strokeWidth={1} />
        <text x={Math.min(toX(hover) + 18, width - padR - 122)} y={padT + 18} fill={C.text} fontSize="11" fontWeight="700">{data[hover].label}</text>
        {series.map((s, si) => <g key={s.key}>
          <circle cx={Math.min(toX(hover) + 22, width - padR - 118)} cy={padT + 34 + si * 18} r={4} fill={s.color} />
          <text x={Math.min(toX(hover) + 30, width - padR - 110)} y={padT + 38 + si * 18} fill={C.textSub} fontSize="10">{s.label}: {data[hover].values[s.key] || 0}</text>
        </g>)}
      </g>}
    </svg>
    {/* 凡例 */}
    <div style={{ display: "flex", gap: 16, justifyContent: "center", marginTop: 8 }}>
      {series.map(s => <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 5 }}>
        <div style={{ width: 10, height: 10, borderRadius: s.type === "bar" ? 2 : "50%", background: s.color }} />
        <span style={{ fontSize: 11, color: C.textSub }}>{s.label}</span>
      </div>)}
    </div>
  </div>;
}

    if (fStMode === "active" && CLOSED_STATUSES.includes(c.status)) return false;
    if (fStMode === "custom" && fStSet.size > 0 && !fStSet.has(c.status)) return false;
    return (!fPos || c.position === fPos) && (!fSrc || c.source === fSrc);
  }), [candidates, q, fStMode, fStSet, fPos, fSrc]);

  const allSel = filtered.length > 0 && filtered.every(c => selected.has(c.id));
  const toggleAll = () => { if (allSel) setSelected(new Set()); else setSelected(new Set(filtered.map(c => c.id))); };
  const toggleOne = (id) => { const n = new Set(selected); if (n.has(id)) n.delete(id); else n.add(id); setSelected(n); };

  return <div>
    <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
      <input placeholder="検索（氏名・経由・現職・備考）" value={q} onChange={e => setQ(e.target.value)} style={{ ...inp, width: 220 }} />
      <div style={{ position: "relative" }}>
        <button ref={stBtnRef} onClick={() => setStPanelOpen(p => !p)} style={{ ...inp, width: 170, textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", background: fStMode === "custom" && fStSet.size > 0 ? C.accent + "18" : C.surface, borderColor: fStMode === "custom" && fStSet.size > 0 ? C.accent + "60" : C.border }}>
          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{stLabel}</span>
          <span style={{ fontSize: 9, marginLeft: 4, color: C.textDim }}>{stPanelOpen ? "▲" : "▼"}</span>
        </button>
        {stPanelOpen && <div ref={stPanelRef} style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 200, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "12px 14px", width: 360, maxHeight: 400, overflow: "auto", boxShadow: "0 16px 40px rgba(0,0,0,.45)" }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
            <button onClick={() => { setFStMode("all"); setFStSet(new Set()); }} style={{ ...btnS, padding: "4px 10px", fontSize: 10, background: fStMode === "all" ? C.accent : C.surfaceAlt, color: fStMode === "all" ? "#fff" : C.textSub }}>全件表示</button>
            <button onClick={() => { setFStMode("active"); setFStSet(new Set()); }} style={{ ...btnS, padding: "4px 10px", fontSize: 10, background: fStMode === "active" ? C.accent : C.surfaceAlt, color: fStMode === "active" ? "#fff" : C.textSub }}>選考中のみ</button>
            {fStMode === "custom" && fStSet.size > 0 && <button onClick={() => { setFStSet(new Set()); setFStMode("all"); }} style={{ ...btnS, padding: "4px 10px", fontSize: 10, background: C.badBg, color: C.bad }}>クリア</button>}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
            {STATUS_LIST.map(s => { const [sc, sbg] = statusColor(s); const on = fStSet.has(s); return <button key={s} onClick={() => toggleSt(s)} style={{ ...btnS, padding: "3px 9px", fontSize: 10, borderRadius: 14, background: on ? sbg : C.surfaceAlt, color: on ? sc : C.textDim, border: on ? `1px solid ${sc}40` : `1px solid transparent`, fontWeight: on ? 700 : 400 }}>{s}</button>; })}
          </div>
        </div>}
      </div>
      <select value={fPos} onChange={e => setFPos(e.target.value)} style={{ ...inp, width: 150, appearance: "auto" }}><option value="">全職種</option>{POSITIONS.map(s => <option key={s}>{s}</option>)}</select>
      <select value={fSrc} onChange={e => setFSrc(e.target.value)} style={{ ...inp, width: 130, appearance: "auto" }}><option value="">全経由</option>{SOURCES.map(s => <option key={s}>{s}</option>)}</select>
      <div style={{ flex: 1 }} />
      <button onClick={onExport} style={{ ...btnS, background: C.surfaceAlt, color: C.textSub, fontSize: 11 }}>↓ CSV出力</button>
      <button onClick={onImport} style={{ ...btnS, background: C.surfaceAlt, color: C.accentL, border: `1px solid ${C.accent}30`, fontSize: 11 }}>↑ CSV取込</button>
      <button onClick={onAdd} style={{ ...btnS, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff" }}>＋ 追加</button>
    </div>

    {selected.size > 0 && <div style={{ display: "flex", gap: 10, alignItems: "center", padding: "10px 14px", marginBottom: 10, background: C.accent + "14", borderRadius: 10, border: `1px solid ${C.accent}30` }}>
      <span style={{ fontSize: 12, fontWeight: 700, color: C.accentL }}>{selected.size}名 選択中</span>
      <select value={bulkStatus} onChange={e => setBulkStatus(e.target.value)} style={{ ...inp, width: 180, appearance: "auto", fontSize: 11 }}>
        <option value="">ステータス一括変更</option>{STATUS_LIST.map(s => <option key={s}>{s}</option>)}
      </select>
      <button onClick={() => { if (bulkStatus) { onBulkStatus([...selected], bulkStatus); setSelected(new Set()); setBulkStatus(""); } }} style={{ ...btnS, background: bulkStatus ? C.accent : C.surfaceAlt, color: bulkStatus ? "#fff" : C.textDim, fontSize: 11, padding: "6px 14px" }}>適用</button>
      <div style={{ flex: 1 }} />
      <button onClick={() => { if (confirm(`${selected.size}名を削除しますか？`)) { onBulkDelete([...selected]); setSelected(new Set()); } }} style={{ ...btnS, background: C.badBg, color: C.bad, fontSize: 11 }}>一括削除</button>
      <button onClick={() => setSelected(new Set())} style={{ ...btnS, background: "transparent", color: C.textDim, fontSize: 11 }}>✕</button>
    </div>}

    <div style={{ fontSize: 11, color: C.textSub, marginBottom: 8 }}>{filtered.length}件 / {candidates.length}件</div>

    <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
        <thead><tr style={{ borderBottom: `2px solid ${C.border}` }}>
          <th style={{ padding: "8px 6px", width: 32 }}><input type="checkbox" checked={allSel} onChange={toggleAll} style={{ accentColor: C.accent, cursor: "pointer" }} /></th>
          {["氏名", "ステータス", "職種", "経由", "応募日", "カジュアル", "滞留", "一次面接", "最終面接", "オファー面談", "書類"].map(h => <th key={h} style={{ textAlign: "left", padding: "8px 8px", color: C.textDim, fontSize: 10, fontWeight: 700, whiteSpace: "nowrap" }}>{h}</th>)}
        </tr></thead>
        <tbody>{filtered.map(c => {
          const stalled = daysStalled(c);
          return <tr key={c.id} style={{ borderBottom: `1px solid ${C.border}`, background: selected.has(c.id) ? C.accent + "0a" : "transparent" }}
            onMouseEnter={e => { if (!selected.has(c.id)) e.currentTarget.style.background = C.surfaceAlt; }}

            <td style={{ padding: "8px 6px" }} onClick={e => e.stopPropagation()}><input type="checkbox" checked={selected.has(c.id)} onChange={() => toggleOne(c.id)} style={{ accentColor: C.accent, cursor: "pointer" }} /></td>

            <td style={{ padding: "8px 8px", color: C.textSub, cursor: "pointer" }} onClick={() => onSelect(c)}>{c.source}</td>
            <td style={{ padding: "8px 8px", color: C.textSub, fontSize: 11, whiteSpace: "nowrap", cursor: "pointer" }} onClick={() => onSelect(c)}>{fmtDate(c.appliedDate)}</td>
            <td style={{ padding: "8px 8px", color: C.textSub, fontSize: 11, whiteSpace: "nowrap", cursor: "pointer" }} onClick={() => onSelect(c)}>{fmtDateTime(c.casualDate, c.casualTime)}</td>
            <td style={{ padding: "8px 8px", cursor: "pointer" }} onClick={() => onSelect(c)}><DaysChip days={stalled} /></td>
            <td style={{ padding: "8px 8px", color: C.textSub, fontSize: 11, whiteSpace: "nowrap", cursor: "pointer" }} onClick={() => onSelect(c)}>{fmtDateTime(c.interview1Date, c.interview1Time)}</td>
            <td style={{ padding: "8px 8px", color: C.textSub, fontSize: 11, whiteSpace: "nowrap", cursor: "pointer" }} onClick={() => onSelect(c)}>{fmtDateTime(c.interviewFinalDate, c.interviewFinalTime)}</td>
            <td style={{ padding: "8px 8px", color: C.textSub, fontSize: 11, whiteSpace: "nowrap", cursor: "pointer" }} onClick={() => onSelect(c)}>{fmtDateTime(c.offerDate, c.offerTime)}</td>
            <td style={{ padding: "8px 8px", cursor: "pointer" }} onClick={() => onSelect(c)}>{c.documentUrl && <a href={c.documentUrl} target="_blank" rel="noopener" onClick={e => e.stopPropagation()} style={{ color: C.accentL, fontSize: 10 }}>書類</a>}</td>
          </tr>;
        })}</tbody>
      </table>
      {filtered.length === 0 && <div style={{ textAlign: "center", padding: 40, color: C.textDim, fontSize: 13 }}>該当なし</div>}
    </div>
  </div>;
}

// ─── Interview View ───
function InterviewView({ candidates, onSelect, use2nd }) {
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = useMemo(() => {
    const r = [];
    candidates.forEach(c => {
      if (c.casualDate && c.casualDate >= today && !c.casualResult) r.push({ ...c, type: "カジュアル", date: c.casualDate, time: c.casualTime, who: c.casualInterviewer });
      if (c.interview1Date && c.interview1Date >= today && !c.interview1Result) r.push({ ...c, type: "一次", date: c.interview1Date, time: c.interview1Time, who: c.interviewer1 });
      if (use2nd && c.interview2Date && c.interview2Date >= today && !c.interview2Result) r.push({ ...c, type: "二次", date: c.interview2Date, time: c.interview2Time, who: c.interviewer2 });
      if (c.interviewFinalDate && c.interviewFinalDate >= today && !c.interviewFinalResult) r.push({ ...c, type: "最終", date: c.interviewFinalDate, time: c.interviewFinalTime, who: c.interviewerFinal });
    });
    return r.sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  }, [candidates, today, use2nd]);

  const past = useMemo(() => {
    const r = [];
    candidates.forEach(c => {
      if (c.casualDate && c.casualResult) r.push({ ...c, type: "カジュアル", date: c.casualDate, result: c.casualResult, note: c.casualNote, passReason: "", rejectReason: "" });
      if (c.interview1Date && c.interview1Result) r.push({ ...c, type: "一次", date: c.interview1Date, result: c.interview1Result, note: c.interview1Note, passReason: c.interview1PassReason, rejectReason: c.interview1RejectReason });
      if (use2nd && c.interview2Date && c.interview2Result) r.push({ ...c, type: "二次", date: c.interview2Date, result: c.interview2Result, note: c.interview2Note, passReason: c.interview2PassReason, rejectReason: c.interview2RejectReason });
      if (c.interviewFinalDate && c.interviewFinalResult) r.push({ ...c, type: "最終", date: c.interviewFinalDate, result: c.interviewFinalResult, note: c.interviewFinalNote, passReason: c.interviewFinalPassReason, rejectReason: c.interviewFinalRejectReason });
    });
    return r.sort((a, b) => b.date.localeCompare(a.date));
  }, [candidates, use2nd]);

  const resultColor = (r) => {
    if (r === "合格" || r === "応募意思あり") return { bg: C.okBg, color: C.ok };
    if (r === "不合格" || r === "応募意思なし" || r === "見送り") return { bg: C.badBg, color: C.bad };
    return { bg: C.warnBg, color: C.warn };
  };

  return <div>
    <h3 style={{ color: C.text, fontSize: 14, fontWeight: 700, marginBottom: 10 }}>今後の面接・面談（{upcoming.length}件）</h3>
    {upcoming.length === 0 && <p style={{ color: C.textDim, fontSize: 12 }}>予定なし</p>}
    <div style={{ display: "grid", gap: 6, marginBottom: 24 }}>{upcoming.map((it, i) => <div key={it.id + it.type + i} onClick={() => onSelect(it)} style={{ background: C.card, borderRadius: 12, padding: "12px 14px", border: `1px solid ${C.border}`, cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}
      onMouseEnter={e => e.currentTarget.style.borderColor = C.accent + "50"} onMouseLeave={e => e.currentTarget.style.borderColor = C.border}>
      <div style={{ minWidth: 48, textAlign: "center", background: C.accentD + "28", borderRadius: 10, padding: "7px 4px" }}><div style={{ fontSize: 17, fontWeight: 800, color: C.accentL }}>{it.date.slice(8)}</div><div style={{ fontSize: 9, color: C.textSub }}>{it.date.slice(5, 7)}月</div></div>
      <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 3 }}>{it.name}</div><div style={{ fontSize: 11, color: C.textSub }}>{it.type}面接　{fmtDateTime(it.date, it.time)}　{it.who || "担当未設定"}</div></div>
      <Badge status={it.status} />
    </div>)}</div>

    <h3 style={{ color: C.text, fontSize: 14, fontWeight: 700, marginBottom: 10 }}>面接・面談結果（直近{Math.min(past.length, 20)}件）</h3>
    <div style={{ display: "grid", gap: 6 }}>{past.slice(0, 20).map((it, i) => {
      const rc = resultColor(it.result);
      return <div key={it.id + it.type + i} onClick={() => onSelect(it)} style={{ background: C.card, borderRadius: 10, padding: "10px 14px", border: `1px solid ${C.border}`, cursor: "pointer" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}><span style={{ fontSize: 12, fontWeight: 600, color: C.text }}>{it.name}</span><span style={{ fontSize: 10, fontWeight: 600, padding: "2px 8px", borderRadius: 10, background: rc.bg, color: rc.color }}>{it.result}</span></div>
        <div style={{ fontSize: 11, color: C.textSub }}>{it.type}面接　{fmtDate(it.date)}</div>
        {it.passReason && <div style={{ fontSize: 11, color: C.ok, marginTop: 3 }}>通過理由: {it.passReason}</div>}
        {it.rejectReason && <div style={{ fontSize: 11, color: C.bad, marginTop: 3 }}>お見送り理由: {it.rejectReason}</div>}
        {it.note && <div style={{ fontSize: 11, color: C.textDim, marginTop: 3 }}>所感: {it.note}</div>}
      </div>;
    })}</div>
  </div>;
}

// ─── Analytics ───
function AnalyticsView({ candidates, use2nd }) {
  const [dt, setDt] = useState("funnel");
  const [funnelDetail, setFunnelDetail] = useState(null);
  const [periodStart, setPeriodStart] = useState("");
  const [periodEnd, setPeriodEnd] = useState("");
  const [chHover, setChHover] = useState(null);

  const STAGE = {
    "カジュアル：書類確認": 0, "カジュアル：書類見送り": 0,
    "カジュアル：調整中": 1, "カジュアル：日程確定": 1, "カジュアル：完了": 2,
    "カジュアル：辞退": 1, "カジュアル：見送り": 1,
    "書類選考中": 3, "書類お見送り": 3, "書類辞退": 3,
    "一次：調整中": 4, "一次：日程確定": 4, "一次：合格": 5, "一次：不合格": 4, "一次：保留": 4, "一次辞退": 4,
    "二次：調整中": 6, "二次：日程確定": 6, "二次：合格": 7, "二次：不合格": 6, "二次辞退": 6,
    "適性検査中": 8, "適性検査辞退": 8,
    "最終：調整中": 9, "最終：日程確定": 9, "最終：合格": 10, "最終：不合格": 9, "最終：保留": 9, "最終辞退": 9,
    "内定：オファー面談": 12, "内定：承諾": 13, "内定：辞退": 12, "内定：保留": 12,
    "入社済み": 14,
  };
  const stg = (c) => STAGE[c.status] || 0;

  // ─── 期間フィルター ───
  const filtered = useMemo(() => {
    return candidates.filter(c => {
      if (!c.appliedDate) return true;
      if (periodStart && c.appliedDate < periodStart) return false;
      if (periodEnd && c.appliedDate > periodEnd) return false;
      return true;
    });
  }, [candidates, periodStart, periodEnd]);

  const showFunnel = useCallback((label, filterFn) => {
    setFunnelDetail({ label, list: filtered.filter(filterFn) });
  }, [filtered]);

  // ─── 期間プリセット ───
  const presets = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const fmt = (d) => d.toISOString().slice(0, 10);
    const lastDay = (yr, mo) => new Date(yr, mo + 1, 0);
    return [
      { label: "今月", start: fmt(new Date(y, m, 1)), end: "" },
      { label: "先月", start: fmt(new Date(y, m - 1, 1)), end: fmt(lastDay(y, m - 1)) },
      { label: "直近3ヶ月", start: fmt(new Date(y, m - 2, 1)), end: "" },
      { label: "全期間", start: "", end: "" },
    ];
  }, []);

  const activePreset = presets.find(p => p.start === periodStart && p.end === periodEnd)?.label || "";

  const s = useMemo(() => {
    // ═══════════════════════════════════════════════════════════
    // 集計の設計思想:
    //   辞退ステータスがフェーズ別に分かれているため、
    //   ステータスだけでどこまで進んだかを正確に判定できる。
    //   例: 「最終辞退」→ 書類通過○、一次通過○、適性検査通過○、最終通過×
    //   例: 「内定：辞退」→ 書類通過○、一次通過○、適性検査通過○、最終通過○、内定○
    //
    //   各ステップの通過ステージ:
    //     書類通過 = ステージ4以上
    //     一次通過 = ステージ5以上 or 一次合格
    //     二次通過 = ステージ7以上 or 二次合格
    //     最終通過 = ステージ10以上 or 最終合格
    //     内定     = ステージ12以上
    // ═══════════════════════════════════════════════════════════

    const stage = (c) => STAGE[c.status] || 0;

    const isDocPass = (c) => stage(c) >= 4 || !!c.interview1Date || !!c.interview1Result;
    const is1Pass = (c) => stage(c) >= 5 || c.interview1Result === "合格";
    const is2Pass = (c) => stage(c) >= 7 || c.interview2Result === "合格";
    const isFPass = (c) => stage(c) >= 10 || c.interviewFinalResult === "合格";
    const isAccepted = (c) => stage(c) >= 13;
    const ALL_DECLINE = ["カジュアル：辞退", "書類辞退", "一次辞退", "二次辞退", "適性検査辞退", "最終辞退", "内定：辞退"];
    const isDecline = (c) => ALL_DECLINE.includes(c.status);

    // ═══ 選考フロー（累積型ファネル）═══
    const total = filtered.length;
    const casual = filtered.filter(c => c.status?.startsWith("カジュアル")).length;
    const docP = filtered.filter(isDocPass).length;
    const is1Done = (c) => stage(c) >= 4 || !!c.interview1Date || !!c.interview1Result;
    const i1D = filtered.filter(is1Done).length;
    const i1P = filtered.filter(is1Pass).length;
    const is2Done = (c) => stage(c) >= 6 || !!c.interview2Date || !!c.interview2Result;
    const i2D = filtered.filter(is2Done).length;
    const i2P = filtered.filter(is2Pass).length;
    const isFDone = (c) => stage(c) >= 10 || c.status === "最終：不合格" || c.status === "最終：保留";
    const iFD = filtered.filter(isFDone).length;
    const iFP = filtered.filter(isFPass).length;
    const accepted = filtered.filter(isAccepted).length;
    const entered = filtered.filter(c => c.status === "入社済み").length;
    const offerDec = filtered.filter(c => c.status === "内定：辞退").length;
    const allDec = filtered.filter(isDecline).length;

    const speeds = { toInt1: [], toIntF: [], toOffer: [], total: [] };
    filtered.forEach(c => {
      if (c.appliedDate && c.interview1Date) { const d = daysBetween(c.appliedDate, c.interview1Date); if (d !== null && d >= 0) speeds.toInt1.push(d); }
      if (c.appliedDate && c.interviewFinalDate) { const d = daysBetween(c.appliedDate, c.interviewFinalDate); if (d !== null && d >= 0) speeds.toIntF.push(d); }
      if (c.appliedDate && c.offerDate) { const d = daysBetween(c.appliedDate, c.offerDate); if (d !== null && d >= 0) speeds.toOffer.push(d); }
      if (c.appliedDate && (c.status === "内定：承諾" || c.status === "入社済み") && c.offerDate) { const d = daysBetween(c.appliedDate, c.offerDate); if (d !== null && d >= 0) speeds.total.push(d); }
    });
    const avg = (arr) => arr.length > 0 ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;

    const bySrc = {}; const byPos = {};
    filtered.forEach(c => {
      const src = c.source || "不明";
      if (!bySrc[src]) bySrc[src] = { applied: 0, docPass: 0, pass1: 0, passF: 0, offer: 0, accepted: 0, declined: 0 };
      bySrc[src].applied++;
      if (isDocPass(c)) bySrc[src].docPass++;
      if (is1Pass(c)) bySrc[src].pass1++;
      if (isFPass(c)) bySrc[src].passF++;
      if (isFPass(c)) bySrc[src].offer++;
      if (isAccepted(c)) bySrc[src].accepted++;
      if (isDecline(c)) bySrc[src].declined++;

      const p = c.position || "不明";
      if (!byPos[p]) byPos[p] = { applied: 0, docPass: 0, offer: 0, accepted: 0, inProc: 0 };
      byPos[p].applied++;
      if (isDocPass(c)) byPos[p].docPass++;
      if (isFPass(c)) byPos[p].offer++;
      if (isAccepted(c)) byPos[p].accepted++;
      if (!CLOSED_STATUSES.includes(c.status)) byPos[p].inProc++;
    });

    const rejectReasons = {};
    filtered.forEach(c => {
      [c.docScreeningReason, c.interview1RejectReason, c.interviewFinalRejectReason].forEach(r => { if (r) rejectReasons[r] = (rejectReasons[r] || 0) + 1; });
    });

    const passReasons = {};
    filtered.forEach(c => {
      [c.interview1PassReason, c.interviewFinalPassReason].forEach(r => { if (r) passReasons[r] = (passReasons[r] || 0) + 1; });
    });

    const withdrawReasons = {};
    const withdrawTimings = {};
    const TIMING_MAP = {
      "カジュアル：辞退": "カジュアル辞退",
      "書類辞退": "書類選考辞退",
      "一次辞退": "一次面接辞退",
      "適性検査辞退": "適性検査辞退",
      "最終辞退": "最終面接辞退",
      "内定：辞退": "内定辞退",
    };
    const decList = filtered.filter(isDecline).map(c => {
      const timing = TIMING_MAP[c.status] || c.status;
      const reason = c.withdrawReason || "";
      if (reason) withdrawReasons[reason] = (withdrawReasons[reason] || 0) + 1;
      withdrawTimings[timing] = (withdrawTimings[timing] || 0) + 1;
      return { name: c.name, pos: c.position, src: c.source, st: c.status, memo: c.memo, reason, timing };
    });
    const inProc = filtered.filter(c => !CLOSED_STATUSES.includes(c.status));

    // ═══ 月別集計 ═══
    const byMonth = {};
    filtered.forEach(c => {
      if (!c.appliedDate) return;
      const ym = c.appliedDate.slice(0, 7);
      if (!byMonth[ym]) byMonth[ym] = { applied: 0, docPass: 0, int1Pass: 0, offer: 0, accepted: 0, declined: 0 };
      byMonth[ym].applied++;
      if (isDocPass(c)) byMonth[ym].docPass++;
      if (is1Pass(c)) byMonth[ym].int1Pass++;
      if (isFPass(c)) byMonth[ym].offer++;
      if (isAccepted(c)) byMonth[ym].accepted++;
      if (isDecline(c)) byMonth[ym].declined++;
    });
    const months = Object.keys(byMonth).sort();
    const monthly = [];
    if (months.length >= 1) {
      let [y, m] = months[0].split("-").map(Number);
      const [ey, em] = months[months.length - 1].split("-").map(Number);
      while (y < ey || (y === ey && m <= em)) {
        const key = `${y}-${String(m).padStart(2, "0")}`;
        monthly.push({ label: `${m}月`, fullLabel: key, values: byMonth[key] || { applied: 0, docPass: 0, int1Pass: 0, offer: 0, accepted: 0, declined: 0 } });
        m++; if (m > 12) { m = 1; y++; }
      }
    }

    return { total, casual, docP, i1D, i1P, i2D, i2P, iFD, iFP, accepted, entered, offerDec, allDec, bySrc, byPos, decList, inProc, monthly, speeds: { toInt1: avg(speeds.toInt1), toIntF: avg(speeds.toIntF), toOffer: avg(speeds.toOffer), total: avg(speeds.total) }, rejectReasons, passReasons, withdrawReasons, withdrawTimings };
  }, [filtered]);

  const funnelStages = useMemo(() => {
    const base = [
      { label: "応募", value: s.total, color: C.info, cumRate: undefined, rate: undefined, onClick: () => showFunnel("応募", () => true) },
      { label: "書類通過", value: s.docP, color: C.accent, rate: s.total > 0 ? Math.round((s.docP / s.total) * 100) : 0, cumRate: s.total > 0 ? ((s.docP / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("書類通過", c => stg(c) >= 4 || !!c.interview1Date || !!c.interview1Result) },
      { label: "一次実施", value: s.i1D, color: "#f59e0b", rate: s.docP > 0 ? Math.round((s.i1D / s.docP) * 100) : 0, cumRate: s.total > 0 ? ((s.i1D / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("一次面接実施", c => stg(c) >= 4 || !!c.interview1Date || !!c.interview1Result) },
      { label: "一次通過", value: s.i1P, color: "#8b5cf6", rate: s.i1D > 0 ? Math.round((s.i1P / s.i1D) * 100) : 0, cumRate: s.total > 0 ? ((s.i1P / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("一次面接通過", c => stg(c) >= 5 || c.interview1Result === "合格") },
    ];
    if (use2nd) {
      base.push(
        { label: "二次実施", value: s.i2D, color: "#e879f9", rate: s.i1P > 0 ? Math.round((s.i2D / s.i1P) * 100) : 0, cumRate: s.total > 0 ? ((s.i2D / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("二次面接実施", c => stg(c) >= 6 || !!c.interview2Date || !!c.interview2Result) },
        { label: "二次通過", value: s.i2P, color: "#c084fc", rate: s.i2D > 0 ? Math.round((s.i2P / s.i2D) * 100) : 0, cumRate: s.total > 0 ? ((s.i2P / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("二次面接通過", c => stg(c) >= 7 || c.interview2Result === "合格") },
      );
    }
    base.push(
      { label: "最終実施", value: s.iFD, color: "#06b6d4", rate: (use2nd ? s.i2P : s.i1P) > 0 ? Math.round((s.iFD / (use2nd ? s.i2P : s.i1P)) * 100) : 0, cumRate: s.total > 0 ? ((s.iFD / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("最終面接実施", c => stg(c) >= 10 || c.status === "最終：不合格" || c.status === "最終：保留") },
      { label: "内定", value: s.iFP, color: C.accentL, rate: s.iFD > 0 ? Math.round((s.iFP / s.iFD) * 100) : 0, cumRate: s.total > 0 ? ((s.iFP / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("内定（最終通過）", c => stg(c) >= 10 || c.interviewFinalResult === "合格") },
      { label: "承諾・入社", value: s.accepted + s.entered, color: C.ok, rate: s.iFP > 0 ? Math.round(((s.accepted + s.entered) / s.iFP) * 100) : 0, cumRate: s.total > 0 ? (((s.accepted + s.entered) / s.total) * 100).toFixed(1) : "0", onClick: () => showFunnel("承諾・入社", c => stg(c) >= 13 || c.status === "入社済み") },
    );
    return base;
  }, [s, use2nd, showFunnel]);

  const dtabs = [{ key: "funnel", label: "ファネル", icon: "▼" }, { key: "trends", label: "推移分析", icon: "📈" }, { key: "speed", label: "選考スピード", icon: "⏱" }, { key: "channel", label: "チャネル別", icon: "◈" }, { key: "decline", label: "辞退分析", icon: "⚠" }, { key: "position", label: "職種別", icon: "◉" }, { key: "pipeline", label: "パイプライン", icon: "◎" }];

  return <div>
    {/* ─── 期間フィルター ─── */}
    <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap", marginBottom: 20, padding: "14px 18px", background: C.card, borderRadius: 14, border: `1px solid ${C.border}` }}>
      <span style={{ fontSize: 12, color: C.textSub, fontWeight: 700, marginRight: 4 }}>期間</span>
      {presets.map(p => <button key={p.label} onClick={() => { setPeriodStart(p.start); setPeriodEnd(p.end); }} style={{ ...btnS, background: activePreset === p.label ? C.accent : C.surfaceAlt, color: activePreset === p.label ? "#fff" : C.textSub, borderRadius: 8, padding: "5px 12px", fontSize: 11, fontWeight: 600, border: `1px solid ${activePreset === p.label ? C.accent : C.border}`, transition: "all .2s" }}>{p.label}</button>)}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: 8 }}>
        <CalendarPicker value={periodStart} onChange={setPeriodStart} label="開始日" />
        <span style={{ color: C.textDim, fontSize: 12 }}>〜</span>
        <CalendarPicker value={periodEnd} onChange={setPeriodEnd} label="終了日" />
      </div>
      {(periodStart || periodEnd) && <span style={{ fontSize: 11, color: C.textDim, marginLeft: 4 }}>{filtered.length}/{candidates.length}件</span>}
    </div>

    {/* ─── ヒーローKPI ─── */}
    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 14 }}>
      <HeroKPICard label="応募数" value={s.total} icon="📥" gradient={[C.accent, C.accentD]} glowColor={C.accent} sub={`全${candidates.length}件中`} />
      <HeroKPICard label="内定数" value={s.iFP} icon="🎯" gradient={["#8b5cf6", "#6d28d9"]} glowColor="#8b5cf6" sub={s.total > 0 ? `転換率 ${(s.iFP / s.total * 100).toFixed(1)}%` : ""} />
      <HeroKPICard label="承諾/入社" value={s.accepted + s.entered} icon="✅" gradient={[C.ok, "#16a34a"]} glowColor={C.ok} sub={s.iFP > 0 ? `承諾率 ${Math.round((s.accepted + s.entered) / s.iFP * 100)}%` : ""} />
    </div>

    {/* ─── サブKPI ─── */}
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 24 }}>
      <KPICard label="書類通過率" value={s.total > 0 ? Math.round((s.docP / s.total) * 100) + "%" : "–"} sub={`${s.docP}/${s.total}名`} icon="📄" color={C.accent} />
      <KPICard label="一次通過率" value={s.i1D > 0 ? Math.round((s.i1P / s.i1D) * 100) + "%" : "–"} sub={`${s.i1P}/${s.i1D}名`} icon="🗣" color="#8b5cf6" />
      <KPICard label="平均選考日数" value={s.speeds.toOffer !== null ? s.speeds.toOffer + "日" : "–"} sub="応募→内定" icon="⏱" color={C.warn} />
      <KPICard label="辞退" value={s.allDec} sub={s.offerDec > 0 ? `内定辞退 ${s.offerDec}名` : ""} icon="↩" color={C.bad} />
    </div>

    {/* ─── タブ（ピル型セグメント） ─── */}
    <div style={{ display: "inline-flex", gap: 2, marginBottom: 20, padding: 4, background: C.surfaceAlt, borderRadius: 12 }}>
      {dtabs.map(t => <button key={t.key} onClick={() => setDt(t.key)} style={{ ...btnS, background: dt === t.key ? C.accent : "transparent", color: dt === t.key ? "#fff" : C.textSub, borderRadius: 10, padding: "7px 16px", fontSize: 12, fontWeight: 600, border: "none", transition: "all .2s" }}>{t.icon} {t.label}</button>)}
    </div>

    {/* ─── ファネル（台形型） ─── */}
    {dt === "funnel" && <div style={{ background: C.card, borderRadius: 16, padding: "24px 20px", border: `1px solid ${C.border}` }}>
      <h3 style={{ color: C.text, fontSize: 15, fontWeight: 700, margin: "0 0 20px" }}>選考ファネル</h3>
      <TrapezoidFunnel stages={funnelStages} onDrillDown={true} />
      {s.offerDec > 0 && <div style={{ marginTop: 12, padding: "8px 14px", background: C.badBg, borderRadius: 10, fontSize: 12, color: C.bad, fontWeight: 600 }}>うち内定辞退 {s.offerDec}名</div>}
      {s.total > 0 && <div style={{ marginTop: 16, padding: "14px 16px", background: C.accent + "10", borderRadius: 10, border: `1px solid ${C.accent}25` }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.accentL, marginBottom: 8 }}>採用効率</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 10 }}>
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800, color: C.text }}>{s.iFP > 0 ? Math.round(s.total / s.iFP) : "–"}</div><div style={{ fontSize: 10, color: C.textSub }}>応募/内定（1名内定に必要な応募数）</div></div>
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800, color: C.text }}>{(s.accepted + s.entered) > 0 ? Math.round(s.total / (s.accepted + s.entered)) : "–"}</div><div style={{ fontSize: 10, color: C.textSub }}>応募/入社（1名入社に必要な応募数）</div></div>
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800, color: C.text }}>{s.docP > 0 ? Math.round(s.total / s.docP) : "–"}</div><div style={{ fontSize: 10, color: C.textSub }}>応募/書類通過</div></div>
        </div>
      </div>}
      {Object.keys(s.rejectReasons).length > 0 && <div style={{ marginTop: 20, padding: "14px 16px", background: C.surfaceAlt, borderRadius: 10 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.text, marginBottom: 8 }}>お見送り理由の傾向</div>
        {Object.entries(s.rejectReasons).sort((a, b) => b[1] - a[1]).map(([r, cnt]) => {
          const mx = Math.max(...Object.values(s.rejectReasons));
          return <div key={r} style={{ marginBottom: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 2, fontSize: 12, color: C.textSub }}><span>{r}</span><span style={{ fontWeight: 700 }}>{cnt}件</span></div>
            <div style={{ height: 6, background: C.bg, borderRadius: 3 }}><div style={{ height: "100%", width: `${(cnt / mx) * 100}%`, background: C.bad, borderRadius: 3, transition: "width .4s" }} /></div>
          </div>;
        })}
      </div>}
      {Object.keys(s.passReasons).length > 0 && <div style={{ marginTop: 14, padding: "14px 16px", background: C.surfaceAlt, borderRadius: 10 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.text, marginBottom: 8 }}>通過理由の傾向</div>
        {Object.entries(s.passReasons).sort((a, b) => b[1] - a[1]).map(([r, cnt]) => {
          const mx = Math.max(...Object.values(s.passReasons));
          return <div key={r} style={{ marginBottom: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 2, fontSize: 12, color: C.textSub }}><span>{r}</span><span style={{ fontWeight: 700 }}>{cnt}件</span></div>
            <div style={{ height: 6, background: C.bg, borderRadius: 3 }}><div style={{ height: "100%", width: `${(cnt / mx) * 100}%`, background: C.ok, borderRadius: 3, transition: "width .4s" }} /></div>
          </div>;
        })}
      </div>}
    </div>}

    {/* ─── スピード（円形ゲージ） ─── */}
    {dt === "speed" && <div style={{ background: C.card, borderRadius: 16, padding: "24px 20px", border: `1px solid ${C.border}` }}>
      <h3 style={{ color: C.text, fontSize: 15, fontWeight: 700, margin: "0 0 20px" }}>選考スピード分析</h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16, justifyItems: "center" }}>
        <CircularGauge value={s.speeds.toInt1} target={14} label="応募 → 一次面接" />
        <CircularGauge value={s.speeds.toIntF} target={28} label="応募 → 最終面接" />
        <CircularGauge value={s.speeds.toOffer} target={35} label="応募 → 内定" />
        <CircularGauge value={s.speeds.total} target={42} label="応募 → 承諾" />
      </div>
    </div>}

    {/* ─── チャネル別（ホバー＋交互行） ─── */}
    {dt === "channel" && <div style={{ background: C.card, borderRadius: 16, padding: "24px 20px", border: `1px solid ${C.border}`, overflowX: "auto" }}>
      <h3 style={{ color: C.text, fontSize: 15, fontWeight: 700, margin: "0 0 16px" }}>チャネル別分析</h3>
      <div style={{ minWidth: 620 }}>
        <div style={{ display: "grid", gridTemplateColumns: "140px 1fr 60px 60px 60px 60px 70px", gap: 8, padding: "6px 0", borderBottom: `2px solid ${C.border}`, fontSize: 10, color: C.textDim, fontWeight: 700 }}>
          <span>チャネル</span><span>応募数</span><span style={{ textAlign: "center" }}>書類通過</span><span style={{ textAlign: "center" }}>一次通過</span><span style={{ textAlign: "center" }}>最終通過</span><span style={{ textAlign: "center" }}>内定</span><span style={{ textAlign: "center" }}>通過率</span>
        </div>
        {Object.entries(s.bySrc).sort((a, b) => b[1].applied - a[1].applied).map(([nm, d], idx) => {
          const mx = Math.max(...Object.values(s.bySrc).map(x => x.applied));
          const isHov = chHover === nm;
          return <div key={nm} onMouseEnter={() => setChHover(nm)} onMouseLeave={() => setChHover(null)} style={{ display: "grid", gridTemplateColumns: "140px 1fr 60px 60px 60px 60px 70px", gap: 8, alignItems: "center", padding: "8px 4px", borderBottom: `1px solid ${C.border}`, fontSize: 12, background: isHov ? C.surfaceAlt : idx % 2 === 0 ? "transparent" : C.bg + "40", borderLeft: isHov ? `3px solid ${C.accent}` : "3px solid transparent", transition: "all .15s", borderRadius: isHov ? 4 : 0 }}>
            <span style={{ color: C.text, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{nm}</span>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}><div style={{ height: 8, background: `linear-gradient(90deg, ${C.accent}, ${C.accentL})`, borderRadius: 4, width: `${Math.max((d.applied / mx) * 100, 3)}%`, transition: "width .4s" }} /><span style={{ color: C.textSub, fontSize: 11 }}>{d.applied}</span></div>
            <span style={{ color: C.textSub, textAlign: "center" }}>{d.docPass}</span><span style={{ color: C.textSub, textAlign: "center" }}>{d.pass1}</span><span style={{ color: C.textSub, textAlign: "center" }}>{d.passF}</span>
            <span style={{ color: d.offer > 0 ? C.ok : C.textDim, textAlign: "center", fontWeight: d.offer > 0 ? 700 : 400 }}>{d.offer}</span>
            <span style={{ color: C.textSub, textAlign: "center" }}>{d.applied > 0 ? Math.round((d.docPass / d.applied) * 100) + "%" : "–"}</span>
          </div>;
        })}
      </div>
    </div>}

    {dt === "decline" && <div style={{ background: C.card, borderRadius: 16, padding: "24px 20px", border: `1px solid ${C.border}` }}>
      <h3 style={{ color: C.text, fontSize: 15, fontWeight: 700, margin: "0 0 16px" }}>辞退分析</h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, marginBottom: 20 }}>
        <KPICard label="辞退合計" value={s.allDec} icon="↩" color={C.bad} />
        <KPICard label="内定辞退" value={s.offerDec} icon="✕" color={C.bad} sub={s.iFP > 0 ? `辞退率 ${Math.round((s.offerDec / s.iFP) * 100)}%` : ""} />
        <KPICard label="選考中辞退" value={s.allDec - s.offerDec} icon="↪" color={C.warn} />
      </div>
      {s.decList.length === 0 ? <div style={{ textAlign: "center", padding: 30, color: C.textDim }}>辞退者なし</div> : <div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          {Object.keys(s.withdrawReasons).length > 0 && <div style={{ padding: "14px 16px", background: C.surfaceAlt, borderRadius: 10, border: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.text, marginBottom: 10 }}>辞退理由の傾向</div>
            {Object.entries(s.withdrawReasons).sort((a, b) => b[1] - a[1]).map(([r, cnt]) => {
              const mx = Math.max(...Object.values(s.withdrawReasons));
              return <div key={r} style={{ marginBottom: 6 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 2, fontSize: 12, color: C.textSub }}><span>{r}</span><span style={{ fontWeight: 700 }}>{cnt}件</span></div>
                <div style={{ height: 6, background: C.bg, borderRadius: 3 }}><div style={{ height: "100%", width: `${(cnt / mx) * 100}%`, background: C.bad, borderRadius: 3, transition: "width .4s" }} /></div>
              </div>;
            })}
          </div>}
          {Object.keys(s.withdrawTimings).length > 0 && <div style={{ padding: "14px 16px", background: C.surfaceAlt, borderRadius: 10, border: `1px solid ${C.border}` }}>

function parseCSV(text) {
  const lines = []; let cur = []; let field = ""; let inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (ch === '"') inQ = false; else field += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ',') { cur.push(field.trim()); field = ""; } else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) { cur.push(field.trim()); if (cur.some(c => c)) lines.push(cur); cur = []; field = ""; if (ch === '\r') i++; } else field += ch; }
  }
  cur.push(field.trim()); if (cur.some(c => c)) lines.push(cur);
  return lines;
}

function parseDate(raw) { if (!raw) return ""; const s = raw.trim(); const iso = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if (iso) return `${iso[1]}-${iso[2].padStart(2, "0")}-${iso[3].padStart(2, "0")}`; const jp = s.match(/(\d{1,2})\/(\d{1,2})/); if (jp) { const y = new Date().getFullYear(); return `${y}-${jp[1].padStart(2, "0")}-${jp[2].padStart(2, "0")}`; } return ""; }
function parseTime(raw) { if (!raw) return ""; const m = raw.trim().match(/(\d{1,2}):(\d{2})/); return m ? `${m[1].padStart(2, "0")}:${m[2]}` : ""; }
function findCol(headers, ...kw) { return headers.findIndex(h => { const hl = (h || "").replace(/\s+/g, ""); return kw.some(k => hl.includes(k)); }); }

function ImportModal({ open, onClose, onImport }) {
  const [step, setStep] = useState(1); const [preview, setPreview] = useState([]); const [importMode, setImportMode] = useState("append"); const fileRef = useRef(null);
  const reset = () => { setStep(1); setPreview([]); };
  const handleFile = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const lines = parseCSV(ev.target.result); if (lines.length < 2) return;
      let hRow = 0;
      for (let i = 0; i < Math.min(lines.length, 10); i++) { if (lines[i].some(c => (c || "").includes("氏名") || (c || "").includes("ステータス"))) { hRow = i; break; } }
      const idx = detectColumns(lines[hRow]);
      const mapped = lines.slice(hRow + 1).filter(r => r.some(c => c)).map(r => csvToCandidate(r, idx)).filter(c => c.name);
      setPreview(mapped); setStep(2);
    };
    reader.readAsText(file, "UTF-8");
  };

  if (!open) return null;

        onDrop={e => { e.preventDefault(); e.currentTarget.style.borderColor = C.border; const f = e.dataTransfer.files?.[0]; if (f) handleFile({ target: { files: [f] } }); }}>
        <div style={{ fontSize: 32, marginBottom: 8 }}>📄</div>
        <div style={{ color: C.text, fontWeight: 600, fontSize: 14 }}>CSVファイルを選択 or ドロップ</div>
        <input ref={fileRef} type="file" accept=".csv,.tsv,.txt" style={{ display: "none" }} onChange={handleFile} />
      </div>
    </div>}
    {step === 2 && <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{preview.length}名のデータを検出</div>
        <select value={importMode} onChange={e => setImportMode(e.target.value)} style={{ ...inp, width: 150, appearance: "auto", fontSize: 12 }}>
          <option value="append">追加（既存に追加）</option><option value="replace">置換（全入替え）</option>
        </select>
      </div>
      <div style={{ overflowX: "auto", maxHeight: 300, marginBottom: 16, border: `1px solid ${C.border}`, borderRadius: 10 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
          <thead><tr style={{ background: C.surfaceAlt, position: "sticky", top: 0 }}>{["氏名", "ステータス", "職種", "経由", "応募日"].map(h => <th key={h} style={{ padding: "6px 10px", textAlign: "left", color: C.textDim, fontSize: 10, fontWeight: 700 }}>{h}</th>)}</tr></thead>
          <tbody>{preview.slice(0, 50).map((c, i) => <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
            <td style={{ padding: "5px 10px", color: C.text, fontWeight: 600 }}>{c.name}</td><td style={{ padding: "5px 10px" }}><Badge status={c.status} /></td>
            <td style={{ padding: "5px 10px", color: C.textSub }}>{c.position}</td><td style={{ padding: "5px 10px", color: C.textSub }}>{c.source}</td>
            <td style={{ padding: "5px 10px", color: C.textSub }}>{c.appliedDate}</td>
          </tr>)}</tbody>
        </table>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between" }}>
        <button onClick={reset} style={{ ...btnS, background: C.surfaceAlt, color: C.textSub }}>戻る</button>
        <button onClick={() => { onImport(preview, importMode); setStep(3); }} style={{ ...btnS, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff", padding: "10px 24px" }}>{importMode === "replace" ? `${preview.length}名で置換` : `${preview.length}名を追加`}</button>
      </div>
    </div>}
    {step === 3 && <div style={{ textAlign: "center", padding: "30px 0" }}>
      <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
      <div style={{ fontSize: 16, fontWeight: 700, color: C.text, marginBottom: 6 }}>{preview.length}名を取り込みました</div>
      <button onClick={() => { reset(); onClose(); }} style={{ ...btnS, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff", padding: "10px 24px", marginTop: 12 }}>閉じる</button>
    </div>}
  </Modal>;
}

// ─── GAS API ───
async function gasGet(pw, action = "list", params = {}) {
  const url = new URL(GAS_URL); url.searchParams.set("pw", pw); url.searchParams.set("action", action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { redirect: "follow" }); return res.json();
}
async function gasPost(pw, body) {
  const res = await fetch(GAS_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pw, ...body }) });
  return res.json();
}

// ─── Main App ───
function App() {
  const [authed, setAuthed] = useState(false);
  const [candidates, setCandidates] = useState([]);
  const [tab, setTab] = useState("list");
  const [modal, setModal] = useState(null);
  const [editC, setEditC] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const [pw, setPw] = useState("");
  const [pwErr, setPwErr] = useState("");
  const [saving, setSaving] = useState(false);
  const [use2nd, setUse2nd] = useState(() => localStorage.getItem("nv-use2nd") === "true");

  useEffect(() => {
    if (!authed) return; setLoading(true);
    (async () => { try { const r = await gasGet(pw, "list"); if (r.ok) setCandidates((r.data || []).map(normalizeCandidateDates)); } catch (e) { console.warn(e); } setLoading(false); })();
  }, [authed]);

  const saveSingle = useCallback(async (c) => { setSaving(true); try { await gasPost(pw, { action: "save", data: c }); } catch {} setSaving(false); }, [pw]);
  const deleteSingle = useCallback(async (id) => { try { await gasPost(pw, { action: "delete", id }); } catch {} }, [pw]);
  const bulkSave = useCallback(async (data, mode) => { setSaving(true); try { await gasPost(pw, { action: "bulk_save", data, mode }); } catch {} setSaving(false); }, [pw]);

  const handleLogin = async () => {
    if (!pw) { setPwErr("パスワードを入力してください"); return; }
    setPwErr("");
    try { const r = await gasGet(pw, "auth"); if (r.ok) setAuthed(true); else setPwErr(r.message || "パスワードが違います"); }
    catch (e) { setPwErr("接続エラー: " + e.message); }
  };

  if (!authed) return <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans JP', 'SF Pro Display', sans-serif" }}>
    <div style={{ background: C.surface, borderRadius: 20, border: `1px solid ${C.border}`, padding: "44px 36px", width: 380, boxShadow: "0 32px 64px rgba(0,0,0,.35)", textAlign: "center" }}>
      <div style={{ width: 50, height: 50, borderRadius: 12, background: `linear-gradient(135deg, ${C.accent}, ${C.accentL})`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px", fontSize: 22 }}>⚡</div>
      <h1 style={{ color: C.text, fontSize: 18, fontWeight: 800, margin: "0 0 4px" }}>採用管理ツール</h1>
      <p style={{ color: C.textSub, fontSize: 11, margin: "0 0 24px" }}>NowVillage Recruitment Manager</p>
      <input type="password" placeholder="パスワード" value={pw} onChange={e => { setPw(e.target.value); setPwErr(""); }}
        onKeyDown={e => e.key === "Enter" && handleLogin()} autoFocus style={{ ...inp, marginBottom: 14, textAlign: "center", fontSize: 14 }} />
      <button onClick={handleLogin} style={{ ...btnS, width: "100%", justifyContent: "center", background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, color: "#fff", padding: 11, fontSize: 13 }}>ログイン</button>
      {pwErr && <p style={{ color: C.bad, fontSize: 11, marginTop: 10 }}>{pwErr}</p>}
    </div>
  </div>;

  if (loading) return <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", color: C.textSub, fontFamily: "'Noto Sans JP', sans-serif" }}>読み込み中…</div>;

  const openNew = () => { setEditC(emptyCandidate()); setModal({ mode: "new" }); };
  const openEdit = (c) => { setEditC({ ...c }); setModal({ mode: "edit" }); };
  const handleSave = async () => { if (!editC) return; if (modal.mode === "new") setCandidates(p => [editC, ...p]); else setCandidates(p => p.map(c => c.id === editC.id ? editC : c)); setModal(null); setEditC(null); await saveSingle(editC); };
  const handleDel = async () => { if (!editC || !confirm("削除しますか？")) return; const id = editC.id; setCandidates(p => p.filter(c => c.id !== id)); setModal(null); setEditC(null); await deleteSingle(id); };
  const handleSC = async (id, st) => { const today = new Date().toISOString().slice(0, 10); const upd = candidates.map(c => c.id === id ? { ...c, status: st, statusChangedDate: today } : c); setCandidates(upd); const t = upd.find(c => c.id === id); if (t) await saveSingle(t); };
  const handleImport = async (data, mode) => { if (mode === "replace") setCandidates(data); else setCandidates(p => [...data, ...p]); await bulkSave(data, mode); };
  const handleBulkStatus = async (ids, status) => { const today = new Date().toISOString().slice(0, 10); const upd = candidates.map(c => ids.includes(c.id) ? { ...c, status, statusChangedDate: today } : c); setCandidates(upd); await bulkSave(upd.filter(c => ids.includes(c.id)), "append"); };
  const handleBulkDelete = async (ids) => { setCandidates(p => p.filter(c => !ids.includes(c.id))); for (const id of ids) await deleteSingle(id); };
  const handleExport = () => { const csv = exportCSV(candidates); const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = `nv_recruit_${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };

  const tabs = [{ key: "list", label: "一覧", icon: "☰" }, { key: "kanban", label: "カンバン", icon: "▦" }, { key: "interview", label: "面接", icon: "📋" }, { key: "analytics", label: "ダッシュボード", icon: "📊" }];

  return <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif" }}>
    <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "0 20px", position: "sticky", top: 0, zIndex: 100 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", maxWidth: 1400, margin: "0 auto", height: 52 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ width: 28, height: 28, borderRadius: 7, background: `linear-gradient(135deg, ${C.accent}, ${C.accentD})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>⚡</div><span style={{ fontWeight: 800, fontSize: 14, color: C.text }}>NV採用管理</span>{saving && <span style={{ fontSize: 9, color: C.warn, fontWeight: 600 }}>保存中…</span>}</div>
        <div style={{ display: "flex", gap: 2 }}>{tabs.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={{ ...btnS, background: tab === t.key ? C.accent + "18" : "transparent", color: tab === t.key ? C.accentL : C.textSub, padding: "7px 12px", fontSize: 11, borderBottom: tab === t.key ? `2px solid ${C.accent}` : "2px solid transparent" }}>{t.icon} {t.label}</button>)}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 10, color: C.textSub }}>
            <input type="checkbox" checked={use2nd} onChange={e => { setUse2nd(e.target.checked); localStorage.setItem("nv-use2nd", e.target.checked); }} style={{ accentColor: C.accent }} />二次面接あり
          </label>
          <button onClick={() => setAuthed(false)} style={{ ...btnS, background: "transparent", color: C.textDim, fontSize: 10 }}>ログアウト</button>
        </div>
      </div>
    </div>
    <div style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 20px 60px" }}>
      {tab === "list" && <ListView candidates={candidates} onSelect={openEdit} onAdd={openNew} onImport={() => setImportOpen(true)} onExport={handleExport} onBulkStatus={handleBulkStatus} onBulkDelete={handleBulkDelete} />}
      {tab === "kanban" && <KanbanView candidates={candidates} onSelect={openEdit} onStatusChange={handleSC} use2nd={use2nd} />}
      {tab === "interview" && <InterviewView candidates={candidates} onSelect={openEdit} use2nd={use2nd} />}
      {tab === "analytics" && <AnalyticsView candidates={candidates} use2nd={use2nd} />}
    </div>
    <Modal open={!!modal} onClose={() => { setModal(null); setEditC(null); }} title={modal?.mode === "new" ? "候補者を追加" : `${editC?.name || ""} を編集`}>
      {editC && <CandidateForm candidate={editC} onChange={setEditC} onSave={handleSave} onDelete={handleDel} isNew={modal?.mode === "new"} use2nd={use2nd} />}
    </Modal>
    <ImportModal open={importOpen} onClose={() => setImportOpen(false)} onImport={handleImport} />
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
